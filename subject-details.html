<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <title>تفاصيل المادة | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=feat-7" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=feat-7" />
  <link rel="stylesheet" href="/assets/css/material-cards.css?v=1" />
  <link rel="stylesheet" href="/assets/css/features-polish.css?v=1" />
  <style>
    #fav-btn {
      color: var(--text-muted);
      transition: transform .18s var(--ease-spring, cubic-bezier(.34,1.56,.64,1)), color .18s ease;
    }
    #fav-btn:hover { color: var(--primary); }
    #fav-btn:active { transform: scale(.88); }
    #fav-btn [data-icon] svg {
      fill: none;
      stroke: currentColor;
      transition: fill .2s ease, stroke .2s ease;
    }
    #fav-btn.is-fav { color: var(--primary); }
    #fav-btn.is-fav [data-icon] svg {
      fill: var(--primary);
      stroke: var(--primary);
      animation: fav-pop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes fav-pop {
      0% { transform: scale(.4) }
      55% { transform: scale(1.35) }
      100% { transform: scale(1) }
    }
    @media (prefers-reduced-motion: reduce) {
      #fav-btn, #fav-btn.is-fav [data-icon] svg { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="subject-details-page">
  <header class="app-header">
    <div class="container">
      <a href="/subjects.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span id="page-title">تفاصيل المادة</span>
      </a>
      <div class="header-actions">
        <button type="button" class="header-btn" id="fav-btn" title="إضافة للمفضلة"><span data-icon="star"></span></button>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div id="subject-header" class="mb-3">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>
      <div class="tabs" id="tabs" aria-label="أقسام المادة">
        <button type="button" class="tab active" data-tab="lectures">المحاضرات</button>
        <button type="button" class="tab" data-tab="sections">السكاشن</button>
        <button type="button" class="tab" data-tab="assignments">الواجبات</button>
        <button type="button" class="tab" data-tab="summaries">ملخصات المادة</button>
        <button type="button" class="tab" data-tab="announcements">إعلانات المادة</button>
      </div>
      <div id="tab-content">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div></div>
      </div>
    </div>
  </main>
      <footer class="site-footer" role="contentinfo">

</html>
