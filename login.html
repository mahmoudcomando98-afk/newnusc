<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f4" />
  <meta name="description" content="سجّل دخولك لمنصة COMANDO بالكود الجامعي — بدون بريد ولا كلمة مرور." />
  <meta property="og:title" content="تسجيل الدخول | COMANDO" />
  <meta property="og:description" content="سجّل دخولك لمنصة COMANDO التعليمية." />
  <meta property="og:image" content="https://comando.vercel.app/nusc.png.jpeg" />
  <meta property="og:url" content="https://comando.vercel.app/login.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://comando.vercel.app/nusc.png.jpeg" />
  <title>تسجيل الدخول | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-1" />
  <link rel="stylesheet" href="/assets/css/auth.css?v=comando-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=comando-1" />
</head>
<body>
  <div class="auth-page">
    <main class="auth-layout auth-login-layout">
      <section class="auth-main" aria-labelledby="login-title">
        <a class="auth-brand" href="/index.html" aria-label="COMANDO">
          <span class="auth-brand-dot" aria-hidden="true"></span>
          <span>COMANDO</span>
        </a>
        <div class="auth-heading">
          <span class="auth-eyebrow"><span class="auth-eyebrow-dot" aria-hidden="true"></span> بوابة COMANDO التعليمية</span>
          <h1 id="login-title">أهلاً بيك</h1>
          <p>اكتب الكود الجامعي بتاعك بس وهندخلك على حسابك على طول.</p>
        </div>
        <div id="config-banner" class="auth-config-banner" role="status" aria-live="polite"></div>
        <form id="code-login-form" class="auth-form" novalidate autocomplete="off">
          <div class="auth-field">
            <label class="form-label" for="student-code">الكود الجامعي</label>
            <input type="text" id="student-code" name="student-code" class="form-input auth-input code-input" placeholder="اكتب كودك هنا" required autocomplete="off" autocapitalize="characters" spellcheck="false" dir="auto" />
          </div>
          <div id="login-error" class="auth-error" role="alert" aria-live="assertive"></div>
          <button type="submit" class="btn btn-primary btn-block auth-submit"><span>تسجيل الدخول</span></button>
        </form>
        <p class="auth-lookup-toggle">ماعندكش الكود؟ <a href="#" id="forgot-code-link">هل نسيت الكود الجامعي</a></p>
        <div id="forgot-panel" class="auth-forgot" hidden>
          <p class="auth-forgot-title">اكتب اسمك هيظهرلك كودك على طول</p>
          <div class="auth-lookup-row">
            <input type="text" id="lookup-name" class="form-input auth-input" placeholder="اكتب اسمك كما هو مسجل" autocomplete="off" />
            <button type="button" id="lookup-btn" class="btn btn-secondary">بحث</button>
          </div>
          <div id="lookup-results" class="auth-lookup-results" aria-live="polite"></div>
        </div>
        <p class="auth-note">المطور: Mahmoud Reda</p>
      </section>
      <aside class="auth-aside" aria-label="مميزات منصة COMANDO">
        <div class="auth-aside-content">
          <h2>يوم دراسي، أبسط وأوضح.</h2>
          <p>تابع موادك ومواعيدك وإعلاناتك بمجرد كتابة كودك الجامعي.</p>
        </div>
      </aside>
    </main>
  </div>
  <script type="module">
    import { initLoginPage } from './assets/js/auth.js';
    import { isSupabaseConfigured, getConfigError } from './assets/js/supabase.js';
    const banner = document.getElementById('config-banner');
    if (!isSupabaseConfigured()) {
      banner.textContent = getConfigError() || 'الإعدادات ناقصة — راجع متغيرات البيئة.';
      banner.classList.add('show');
    }
    initLoginPage();
  </script>
</body>
</html>
