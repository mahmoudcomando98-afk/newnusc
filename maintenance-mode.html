<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1d8" />
  <title>المنصة تحت الصيانة</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 15% 10%,#fff8d8,transparent 40%),radial-gradient(circle at 88% 86%,#f5edc8,transparent 36%),#fbfaf5; }
    .maintenance-card { width:min(560px,100%); padding:clamp(24px,5vw,44px); text-align:center; border:1px solid #eee4b4; border-radius:26px; background:rgba(255,255,255,.96); box-shadow:0 28px 90px rgba(76,65,20,.14); animation:maintenanceIn .45s cubic-bezier(.2,.8,.2,1) both; }
    .maintenance-mark { display:grid; place-items:center; width:76px; height:76px; margin:0 auto 20px; border-radius:24px; background:linear-gradient(145deg,#fff6c7,#f4e7a5); color:#80690b; font-size:1.9rem; box-shadow:0 8px 22px rgba(128,105,11,.12); animation:maintenancePulse 2.4s ease-in-out infinite; }
    .maintenance-card h1 { margin:0 0 12px; font-size:clamp(1.5rem,4vw,2rem); color:#343222; line-height:1.4; }
    .maintenance-card p { color:#777568; line-height:1.9; margin:0 auto; }
    .maintenance-status { display:inline-flex; align-items:center; gap:8px; margin:22px 0 0; padding:9px 14px; border:1px solid #eee4b4; border-radius:999px; background:#fffbea; color:#79640b; font-size:.85rem; font-weight:700; }
    .maintenance-status span { width:8px; height:8px; border-radius:50%; background:#d0a929; }
    .maintenance-actions { margin-top:26px; display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
    .maintenance-footnote { margin-top:18px!important; font-size:.76rem; color:#969184!important; }
    @keyframes maintenanceIn { from { opacity:0; transform:translateY(12px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes maintenancePulse { 0%,100% { box-shadow:0 8px 22px rgba(128,105,11,.12); } 50% { box-shadow:0 10px 30px rgba(128,105,11,.22); } }
    @media (prefers-reduced-motion:reduce) { .maintenance-card,.maintenance-mark { animation:none!important; } }
  </style>
</head>
<body>
  <main class="maintenance-card">
    <div class="maintenance-mark" aria-hidden="true">⚙</div>
    <p id="maintenance-brand" style="font-size:.85rem;font-weight:800;letter-spacing:.04em;color:#79640b;margin-bottom:8px">NUSC</p>
    <h1>المنصة حاليًا تحت الصيانة</h1>
    <p id="maintenance-message">بننفّذ بعض التحسينات حاليًا علشان نرجعلكم بخدمة أفضل. المنصة هتكون متاحة تاني قريبًا، شكرًا لصبركم.</p>
    <div class="maintenance-status"><span aria-hidden="true"></span> جاري تنفيذ أعمال الصيانة</div>
    <div class="maintenance-actions">
      <button type="button" class="btn btn-primary" id="refresh-page">إعادة المحاولة</button>
      <a class="btn btn-secondary" href="/login.html?next=%2Fadmin%2Fsettings.html">دخول الإدارة</a>
    </div>
    <p class="maintenance-footnote">خدمات المنصة متوقفة مؤقتًا أثناء الصيانة. جرّب تاني بعد قليل.</p>
  </main>
  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    let isLoading = false;
    const isEnabled = (value) => value === true || value === 'true' || value === 1 || value === '1';
    const statusMessage = new URLSearchParams(window.location.search).get('status');

    async function loadMaintenanceMessage() {
      if (isLoading) return;
      isLoading = true;
      try {
        const { data, error } = await supabase.from('platform_settings')
          .select('key, value').in('key', ['site_name', 'site_maintenance', 'maintenance_message']);
        if (error) throw error;

        const settings = new Map((data || []).map((row) => [row.key, row.value]));
        const name = settings.get('site_name');
        const message = settings.get('maintenance_message');
        if (typeof name === 'string' && name.trim()) {
          document.getElementById('maintenance-brand').textContent = name.trim();
          document.title = name.trim() + ' | تحت الصيانة';
        }
        if (typeof message === 'string' && message.trim()) {
          document.getElementById('maintenance-message').textContent = message.trim();
        }
        if (!isEnabled(settings.get('site_maintenance'))) {
          window.location.replace('/home.html');
        }
      } catch (error) {
        console.warn('Could not load maintenance message:', error?.message || error);
        if (statusMessage === 'unavailable') {
          document.querySelector('.maintenance-card h1').textContent = 'المنصة متوقفة مؤقتًا';
          document.getElementById('maintenance-message').textContent =
            'المنصة غير متاحة مؤقتًا. اضغط إعادة المحاولة بعد قليل.';
        }
      } finally {
        isLoading = false;
      }
    }

    document.getElementById('refresh-page').addEventListener('click', () => window.location.reload());
    loadMaintenanceMessage();
    // Refresh the notice and return users automatically after maintenance is disabled.
    window.setInterval(loadMaintenanceMessage, 10000);
  </script>
</body>
</html>
