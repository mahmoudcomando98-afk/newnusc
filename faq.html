<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>الأسئلة الشائعة | NUSC Student Hub</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=neutral-v2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=neutral-v2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/profile.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الأسئلة الشائعة</span>
      </a>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div id="faq-list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" class="active"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { protectPage } from './assets/js/auth.js';
    import { escapeHtml, showEmpty, showError, initIcons } from './assets/js/utils.js';
    async function init() {
      const result = await protectPage();
      if (!result) return;
      initIcons();
      const el = document.getElementById('faq-list');
      try {
        const { data, error } = await supabase.from('faq').select('id, question, answer, category').eq('is_published', true).order('sort_order');
        if (error) throw error;
        if (!data?.length) { showEmpty(el, 'لا توجد أسئلة شائعة حالياً'); return; }
        el.innerHTML = data.map(f => `<div class="card mb-2"><h3 class="card-title">${escapeHtml(f.question)}</h3>${f.category ? `<span class="badge badge-primary">${escapeHtml(f.category)}</span>` : ''}<p class="text-sm mt-2" style="white-space:pre-wrap">${escapeHtml(f.answer)}</p></div>`).join('');
      } catch (err) { showError(el, 'تعذر تحميل الأسئلة'); }
    }
    init();
  </script>
</body>
</html>
