name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/security-build-maintenance

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-build-maintenance
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Vite security update"
          git push origin HEAD:fix/security-build-maintenance
