name: Validate NUSC build

on:
  pull_request:
  push:
    branches:
      - main
      - fix/security-build-maintenance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static security and requirements audit
        run: npm run audit
      - name: Report dependency advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const report = require("/tmp/npm-audit.json"); const items = Object.entries(report.vulnerabilities || {}); if (!items.length) console.log("npm audit: no reported package vulnerabilities"); for (const [name, item] of items) console.log(name + ": " + item.severity + "; fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - name: Build all pages
        run: npm run build
