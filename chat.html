<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>دردشة الدفعة | COMANDO</title>
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <link rel="stylesheet" href="/assets/css/main.css?v=chat1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=chat1" />
  <link rel="stylesheet" href="/assets/css/chat.css?v=7" />
</head>
<body>
  <header class="chat-topbar">
    <div class="container chat-topbar-inner">
      <a href="/home.html" class="chat-back" aria-label="رجوع للرئيسية">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="chat-title">
        <div class="chat-title-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div>
          <h1>دردشة الدفعة</h1>
          <p>دردشة مجتمعية للدفعة</p>
        </div>
      </div>
      <div class="chat-members" aria-label="عدد الأعضاء">
        <strong id="chat-count">—</strong>
        <small>عضو</small>
      </div>
    </div>
  </header>

  <main class="chat-page" role="main">
    <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
    <div class="chat-reply-bar" id="chat-reply-bar" hidden>
      <svg class="chat-reply-bar-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
      <div class="chat-reply-bar-info">
        <span class="chat-reply-bar-author" id="chat-reply-author"></span>
        <span class="chat-reply-bar-text" id="chat-reply-text"></span>
      </div>
      <button type="button" class="chat-reply-cancel" id="chat-reply-cancel" aria-label="إلغاء الرد">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chat-ban" id="chat-ban" hidden role="alert">
      <span class="chat-ban-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span>
      <p class="chat-ban-title">تم حظرك من الدردشة لمدة ساعة</p>
      <p class="chat-ban-timer"><span id="ban-countdown">60:00</span></p>
      <p class="chat-ban-hint">الكلام الغلط ملوش محل — تقدر تكتب تاني لما العدّاد يخلص</p>
    </div>
    <form class="chat-composer" id="chat-form" autocomplete="off" novalidate>
      <input type="text" class="chat-input" id="chat-input" placeholder="اكتب سؤالك…" maxlength="600" autocomplete="off" required />
      <button type="submit" class="chat-send" id="chat-send" aria-label="أرسل">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </main>

  <!-- قائمة طويلة الضغطة على رسالة -->
  <div class="chat-menu" id="chat-menu" hidden role="menu">
    <button type="button" class="chat-menu-item" data-menu="reply" role="menuitem"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg> رد</button>
    <button type="button" class="chat-menu-item" data-menu="edit" role="menuitem"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> تعديل</button>
    <button type="button" class="chat-menu-item" data-menu="delete" role="menuitem"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> حذف</button>
  </div>

  <!-- شيت حذف الرسالة -->
  <div class="chat-modal" id="chat-delete-modal" hidden role="dialog" aria-modal="true" aria-label="حذف الرسالة">
    <div class="chat-modal-backdrop" data-del-cancel></div>
    <div class="chat-modal-card">
      <h3>شيل الرسالة إزاي؟</h3>
      <button type="button" class="chat-modal-opt chat-modal-danger" id="del-for-everyone"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> حذف للجميع</button>
      <button type="button" class="chat-modal-opt" id="del-for-me"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="2" y1="2" x2="22" y2="22"/></svg> حذف لي فقط</button>
      <button type="button" class="chat-modal-cancel" data-del-cancel>إلغاء</button>
    </div>
  </div>

  <div class="chat-toast" id="chat-toast" hidden role="status"></div>

  <script type="module" src="/assets/js/chat.js?v=9"></script>
</body>
</html>
