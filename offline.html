<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f7">
  <meta name="robots" content="noindex">
  <title>لا يوجد اتصال | NUSC</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#faf9f7;color:#2c2a28}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#faf9f7}
    main{width:min(420px,100%);padding:28px 22px;background:#fff;border:1px solid #ebe6e1;border-radius:10px;text-align:center}
    .code{font-size:1rem;font-weight:800;color:#b08a4a;letter-spacing:.04em}
    h1{font-size:1.15rem;margin:14px 0 6px}p{line-height:1.7;color:#7a736c;margin:0;font-size:.92rem}
    nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    a,button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;text-decoration:none;border:1px solid #e0d4ca;border-radius:7px;padding:8px 14px;font-weight:700;color:#c56a3a;font-size:.88rem;background:#fff;cursor:pointer;font-family:inherit}
    .primary{background:#c56a3a;color:#fff;border-color:#c56a3a}
    :focus-visible{outline:2px solid #d4a078;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <div class="code">OFFLINE</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الشبكة ثم أعد المحاولة. بعض البيانات المخزّنة قد تظهر إن وُجدت.</p>
    <nav aria-label="متابعة">
      <button type="button" class="primary" onclick="location.reload()">إعادة المحاولة</button>
      <a href="/home.html">الرئيسية</a>
    </nav>
  </main>
  <script>
    window.addEventListener('online', function () { location.href = '/home.html'; });
  </script>
</body>
</html>
