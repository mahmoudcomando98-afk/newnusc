<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>جدول السكاشن الأونلاين | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=ui-polish-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=ui-polish-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>جدول الأونلاين</span>
      </a>
      <a href="/online-schedule.html" class="btn btn-sm btn-secondary" target="_blank" rel="noopener noreferrer">معاينة</a>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content" style="max-width:720px">
      <h1 class="mb-2" style="font-size:1.2rem">جدول السكاشن الأونلاين</h1>
      <p class="text-sm text-muted mb-3">ضيف الأيام والسكاشن والمعيدين. الجدول يظهر للطلاب بنفس شكل الصورة.</p>

      <div class="card mb-3">
        <h2 class="card-title mb-2" style="font-size:1rem">عنوان الصفحة</h2>
        <form id="meta-form">
          <div class="form-group">
            <label class="form-label" for="meta-title">العنوان</label>
            <input id="meta-title" class="form-input" maxlength="80" placeholder="جدول الأونلاين" />
          </div>
          <div class="form-group">
            <label class="form-label" for="meta-subtitle">العنوان الفرعي</label>
            <input id="meta-subtitle" class="form-input" maxlength="120" placeholder="سنة أولى – Humanities and Social Sector" />
          </div>
          <div class="form-group">
            <label class="form-label" for="meta-note">ملاحظة</label>
            <input id="meta-note" class="form-input" maxlength="200" placeholder="كل مقرر سكشن أونلاين بلينك ومعيد مختلف." />
          </div>
          <div class="form-group">
            <label class="form-label" for="meta-footer">تذييل</label>
            <input id="meta-footer" class="form-input" maxlength="80" placeholder="الأوقات بتوقيت القاهرة" />
          </div>
          <button type="submit" class="btn btn-primary btn-sm">حفظ العنوان</button>
        </form>
      </div>

      <div class="card mb-3">
        <h2 class="card-title mb-2" style="font-size:1rem" id="form-heading">إضافة سكشن</h2>
        <form id="session-form">
          <input type="hidden" id="edit-id" value="" />
          <div class="form-group">
            <label class="form-label" for="day">اليوم *</label>
            <select id="day" class="form-select" required>
              <option value="0">الأحد</option>
              <option value="1">الاثنين</option>
              <option value="2">الثلاثاء</option>
              <option value="3">الأربعاء</option>
              <option value="4">الخميس</option>
              <option value="5">الجمعة</option>
              <option value="6">السبت</option>
            </select>
          </div>
          <div class="flex gap-1 flex-wrap">
            <div class="form-group" style="flex:1;min-width:140px">
              <label class="form-label" for="start_time">من *</label>
              <input type="time" id="start_time" class="form-input" required />
            </div>
            <div class="form-group" style="flex:1;min-width:140px">
              <label class="form-label" for="end_time">إلى</label>
              <input type="time" id="end_time" class="form-input" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="course_name">المقرر *</label>
            <input id="course_name" class="form-input" required maxlength="120" placeholder="Computer Introduction" />
          </div>
          <div class="form-group">
            <label class="form-label" for="instructor_name">المعيد</label>
            <input id="instructor_name" class="form-input" maxlength="120" placeholder="م. ياسمين سمير" />
          </div>
          <div class="form-group">
            <label class="form-label" for="link_url">رابط السكشن (اختياري)</label>
            <input id="link_url" class="form-input" dir="ltr" maxlength="500" placeholder="https://..." />
          </div>
          <div class="flex gap-1">
            <button type="submit" class="btn btn-primary" id="save-btn">إضافة</button>
            <button type="button" class="btn btn-secondary hidden" id="cancel-btn">إلغاء</button>
          </div>
        </form>
      </div>

      <h2 class="mb-2" style="font-size:1.05rem">السكاشن الحالية</h2>
      <div id="list"></div>
    </div>
  </main>

  <script type="module" src="/assets/js/admin-online-schedule.js?v=online-sched-1"></script>
</body>
</html>
