<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إدارة الكويزات | COMANDO</title>
  <link rel="stylesheet" href="/comando-cairo.css?v=3" />
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-cairo-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=comando-cairo-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo"><span class="logo-icon">C</span><span>الكويزات</span></a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ كويز</button>
    </div>
  </header>
  <main class="page" style="padding-bottom:24px">
    <div class="container page-content">
      <div id="form-panel" class="card mb-3 hidden">
        <form id="quiz-form">
          <div class="form-group"><label class="form-label">العنوان *</label><input type="text" id="title" class="form-input" required /></div>
          <div class="form-group"><label class="form-label">القواعد / التعليمات</label><textarea id="rules" class="form-textarea"></textarea></div>
          <div class="form-group"><label class="form-label">المادة</label><select id="subject_id" class="form-select"><option value="">— اختر —</option></select></div>
          <div class="form-group"><label class="form-label">الدرجة الكلية (اختياري)</label><input type="number" min="0" id="total_marks" class="form-input" /></div>
          <div class="form-group"><label class="form-label">درجة النجاح (اختياري)</label><input type="number" min="0" id="passing_score" class="form-input" /></div>
          <div class="form-group"><label class="form-label">مدة الحل للطالب (دقائق)</label><input type="number" min="1" id="duration_minutes" class="form-input" placeholder="مثال: 30" /><p class="form-hint">من لحظة ما الطالب يضغط ابدأ — العداد يبدأ.</p></div>
          <div class="form-group"><label class="form-label">يفتح من</label><input type="datetime-local" id="quiz_date" class="form-input" dir="ltr" /></div>
          <div class="form-group"><label class="form-label">يقفل في</label><input type="datetime-local" id="end_at" class="form-input" dir="ltr" /><p class="form-hint">بعد الوقت ده مش هيقدر أي طالب يبدأ الكويز، وبعده تظهر الإجابات التفصيلية.</p></div>
          <div class="form-group"><label class="form-label">رابط خارجي (اختياري)</label><input type="url" id="quiz_url" class="form-input" dir="ltr" placeholder="https://forms.google.com/..." /></div>
          <div class="form-group">
            <label class="form-label" for="solution_image">صورة حل الكويز (اختياري)</label>
            <input type="file" id="solution_image" class="form-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
          </div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="allow_retake" /><span>السماح بإعادة المحاولة</span></label></div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_published" checked /><span>منشور</span></label></div>
          <div class="flex gap-1"><button type="submit" class="btn btn-primary">حفظ</button><button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button></div>
        </form>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <input type="file" id="solution-attach-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" style="display:none" />
  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, formatDate, showEmpty, showError, showToast, withLoading, initIcons } from '../assets/js/utils.js';
    let profile = null;
    let attachTargetId = null;

    async function init() {
      const result = await protectAdminPage(); if (!result) return;
      profile = result.profile; initIcons();
      document.documentElement.classList.remove('admin-auth-pending');
      const { data: subjects, error: subjectsError } = await supabase.from('subjects').select('id, name').order('name');
      if (subjectsError) console.warn('Could not load subjects:', subjectsError.message);
      const subjectSelect = document.getElementById('subject_id');
      (subjects || []).forEach(subject => { const option = document.createElement('option'); option.value = subject.id; option.textContent = subject.name; subjectSelect.appendChild(option); });
      document.getElementById('add-btn').onclick = () => document.getElementById('form-panel').classList.remove('hidden');
      document.getElementById('cancel-btn').onclick = () => document.getElementById('form-panel').classList.add('hidden');
      document.getElementById('quiz-form').onsubmit = save;
      document.getElementById('solution-attach-input').addEventListener('change', onAttachSolution);
      await load();
    }

    async function uploadSolutionImage(file) {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `solutions/quizzes/${profile.id}/${Date.now()}_${safeName}`;
      const { error } = await supabase.storage.from('materials').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false });
      if (error) throw error;
      return path;
    }

    async function onAttachSolution(event) {
      const file = event.target.files?.[0];
      const quizId = attachTargetId;
      attachTargetId = null;
      if (!file || !quizId) return;
      if (!/^image\/(jpeg|png|webp)$/i.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) {
        showToast('اختار صورة JPG أو PNG أو WebP.', 'error');
        return;
      }
      try {
        const path = await uploadSolutionImage(file);
        const { data: existing } = await supabase.from('quizzes').select('solution_image_path').eq('id', quizId).maybeSingle();
        const { error } = await supabase.from('quizzes').update({ solution_image_path: path }).eq('id', quizId);
        if (error) {
          await supabase.storage.from('materials').remove([path]);
          showToast(error.message || 'تعذر حفظ صورة الحل.', 'error');
          return;
        }
        if (existing?.solution_image_path && existing.solution_image_path !== path) {
          await supabase.storage.from('materials').remove([existing.solution_image_path]).catch(() => {});
        }
        showToast('تم حفظ صورة حل الكويز.', 'success');
        await load();
      } catch (err) {
        showToast(err.message || 'فشل رفع صورة الحل.', 'error');
      }
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase.from('quizzes').select('id, title, start_at, end_at, duration_minutes, is_published, quiz_url, total_marks, passing_score, subject_id, solution_image_path, has_questions, allow_retake').order('start_at', { ascending: false });
        if (error) throw error;
        if (!data?.length) { showEmpty(el, 'لا توجد كويزات'); return; }
        el.innerHTML = data.map(q => {
          const hasSolution = !!q.solution_image_path;
          return `<div class="card mb-2">
            <div class="flex justify-between flex-wrap gap-1">
              <div>
                <h3 class="card-title">${escapeHtml(q.title)}</h3>
                <p class="text-sm text-muted">${q.start_at ? 'يفتح: ' + formatDate(q.start_at,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}${q.end_at ? ' · يقفل: ' + formatDate(q.end_at,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}</p>
                <p class="text-sm mt-1">${q.has_questions ? '<span class="badge badge-success">أسئلة داخل المنصة</span>' : '<span class="badge">مفيش أسئلة داخلية</span>'} ${hasSolution ? '<span class="badge badge-success">صورة حل</span>' : ''}</p>
              </div>
              <div class="flex gap-1 flex-wrap">
                <a class="btn btn-sm btn-primary" href="/admin/quiz-questions.html?quiz=${q.id}">الأسئلة</a>
                <a class="btn btn-sm btn-secondary" href="/admin/quiz-results.html?quiz=${q.id}">النتائج</a>
                <button type="button" class="btn btn-sm btn-secondary" data-sol="${q.id}">${hasSolution ? 'تغيير صورة الحل' : 'صورة الحل'}</button>
                <button type="button" class="btn btn-sm btn-danger" data-del="${q.id}">حذف</button>
              </div>
            </div>
            ${q.quiz_url ? `<div class="mt-2"><p class="text-sm text-muted" dir="ltr" style="overflow-wrap:anywhere">${escapeHtml(q.quiz_url)}</p></div>` : ''}
          </div>`;
        }).join('');
        el.querySelectorAll('[data-sol]').forEach(btn => btn.onclick = () => {
          attachTargetId = btn.dataset.sol;
          document.getElementById('solution-attach-input').value = '';
          document.getElementById('solution-attach-input').click();
        });
        el.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
          if(!confirm('حذف؟')) return;
          const item = data.find(q => String(q.id) === String(btn.dataset.del));
          await supabase.from('quizzes').delete().eq('id', btn.dataset.del);
          if (item?.solution_image_path) await supabase.storage.from('materials').remove([item.solution_image_path]).catch(() => {});
          await load();
        });
      } catch (error) {
        showError(el, 'تعذر تحميل الكويزات.');
      }
    }

    async function save(e) {
      e.preventDefault();
      const solutionFile = document.getElementById('solution_image').files?.[0] || null;
      await withLoading(e.target.querySelector('[type=submit]'), async () => {
        let solutionPath = null;
        if (solutionFile) {
          try { solutionPath = await uploadSolutionImage(solutionFile); }
          catch (err) { showToast(err.message || 'فشل رفع صورة الحل.', 'error'); return; }
        }
        const payload = {
          title: document.getElementById('title').value.trim(),
          instructions: document.getElementById('rules').value.trim() || null,
          subject_id: document.getElementById('subject_id').value || null,
          start_at: document.getElementById('quiz_date').value ? new Date(document.getElementById('quiz_date').value).toISOString() : null,
          end_at: document.getElementById('end_at').value ? new Date(document.getElementById('end_at').value).toISOString() : null,
          quiz_url: document.getElementById('quiz_url').value.trim() || null,
          duration_minutes: document.getElementById('duration_minutes').value ? Number(document.getElementById('duration_minutes').value) : null,
          total_marks: document.getElementById('total_marks').value ? Number(document.getElementById('total_marks').value) : null,
          passing_score: document.getElementById('passing_score').value ? Number(document.getElementById('passing_score').value) : null,
          allow_retake: document.getElementById('allow_retake').checked,
          is_published: document.getElementById('is_published').checked
        };
        if (solutionPath) payload.solution_image_path = solutionPath;

        let { error } = await supabase.from('quizzes').insert(payload);
        if (error && /allow_retake|has_questions|end_at/i.test(String(error.message || ''))) {
          delete payload.allow_retake;
          ({ error } = await supabase.from('quizzes').insert(payload));
        }
        if (error) {
          if (solutionPath) await supabase.storage.from('materials').remove([solutionPath]).catch(() => {});
          showToast(error.message, 'error');
          return;
        }
        showToast('تم حفظ الكويز — من زر الأسئلة ضيف الأسئلة', 'success');
        document.getElementById('form-panel').classList.add('hidden');
        e.target.reset();
        document.getElementById('is_published').checked = true;
        await load();
      });
    }
    init();
  </script>
</body>
</html>
