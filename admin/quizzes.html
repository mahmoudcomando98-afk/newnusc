<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>إدارة الكويزات | NUSC Student Hub</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo"><span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span><span>الكويزات</span></a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ كويز</button>
    </div>
  </header>
  <main class="page" style="padding-bottom:24px">
    <div class="container page-content">
      <div id="form-panel" class="card mb-3 hidden">
        <form id="quiz-form">
          <div class="form-group"><label class="form-label">العنوان *</label><input type="text" id="title" class="form-input" required /></div>
          <div class="form-group"><label class="form-label">الموضوعات</label><input type="text" id="topics" class="form-input" /></div>
          <div class="form-group"><label class="form-label">بداية</label><input type="datetime-local" id="start_at" class="form-input" dir="ltr" /></div>
          <div class="form-group"><label class="form-label">نهاية</label><input type="datetime-local" id="end_at" class="form-input" dir="ltr" /></div>
          <div class="form-group"><label class="form-label">رابط الكويز</label><input type="url" id="quiz_url" class="form-input" dir="ltr" /></div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_published" checked /><span>منشور</span></label></div>
          <div class="flex gap-1"><button type="submit" class="btn btn-primary">حفظ</button><button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button></div>
        </form>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, formatDate, showEmpty, showError, showToast, withLoading, initIcons } from '../assets/js/utils.js';
    let profile = null;
    async function init() {
      const result = await protectAdminPage(); if (!result) return;
      profile = result.profile; initIcons();
      document.getElementById('add-btn').onclick = () => document.getElementById('form-panel').classList.remove('hidden');
      document.getElementById('cancel-btn').onclick = () => document.getElementById('form-panel').classList.add('hidden');
      document.getElementById('quiz-form').onsubmit = save;
      await load();
    }
    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase.from('quizzes').select('id, title, start_at, end_at, status, is_published').order('start_at', { ascending: false });
        if (error) throw error;
        if (!data?.length) { showEmpty(el, 'لا توجد كويزات'); return; }
        el.innerHTML = data.map(q => `<div class="card mb-2"><div class="flex justify-between"><div><h3 class="card-title">${escapeHtml(q.title)}</h3><p class="text-sm text-muted">${q.start_at ? formatDate(q.start_at,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}</p></div><button type="button" class="btn btn-sm btn-danger" data-del="${q.id}">حذف</button></div></div>`).join('');
        el.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => { if(!confirm('حذف؟')) return; await supabase.from('quizzes').delete().eq('id', btn.dataset.del); await load(); });
      } catch { showError(el, 'تعذر'); }
    }
    async function save(e) {
      e.preventDefault();
      await withLoading(e.target.querySelector('[type=submit]'), async () => {
        const { error } = await supabase.from('quizzes').insert({
          title: document.getElementById('title').value.trim(),
          topics: document.getElementById('topics').value.trim() || null,
          start_at: document.getElementById('start_at').value || null,
          end_at: document.getElementById('end_at').value || null,
          quiz_url: document.getElementById('quiz_url').value.trim() || null,
          is_published: document.getElementById('is_published').checked,
          created_by: profile.id
        });
        if (error) { showToast(error.message, 'error'); return; }
        showToast('تم', 'success');
        document.getElementById('form-panel').classList.add('hidden');
        e.target.reset(); await load();
      })();
    }
    init();
  </script>
</body>
</html>
