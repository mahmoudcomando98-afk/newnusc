<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إرسال إشعارات | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=ui-polish-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=ui-polish-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الإشعارات</span>
      </a>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content" style="max-width:640px">
      <h1 class="mb-2" style="font-size:1.25rem">إرسال إشعار للطلاب</h1>
      <p class="text-sm text-muted mb-3">
        الإشعار يظهر في لوحة إشعارات الطالب، ولو الطالب فعّل إشعارات المتصفح يوصله على الهاتف كمان.
      </p>

      <div class="card mb-3">
        <form id="notif-form">
          <div class="form-group">
            <label class="form-label" for="title">عنوان الإشعار *</label>
            <input type="text" id="title" class="form-input" required maxlength="120" placeholder="مثال: تذكير بموعد الكويز" />
          </div>
          <div class="form-group">
            <label class="form-label" for="body">نص الإشعار *</label>
            <textarea id="body" class="form-textarea" required maxlength="500" rows="4" placeholder="اكتب الرسالة باختصار ووضوح"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="link">رابط عند الضغط (اختياري)</label>
            <input type="text" id="link" class="form-input" dir="ltr" maxlength="500" placeholder="/quizzes.html أو https://..." />
            <p class="text-sm text-muted mt-1">لو سيبته فاضي، هيفتح صفحة الإشعارات.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="type">النوع</label>
            <select id="type" class="form-select">
              <option value="info">عام</option>
              <option value="warning">تنبيه</option>
              <option value="success">مهم / إيجابي</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" id="send-btn">إرسال لجميع الطلاب</button>
        </form>
      </div>

      <h2 class="mb-2" style="font-size:1.05rem">آخر الإشعارات</h2>
      <p class="text-sm text-muted mb-2">تقدر تحذف أي إشعار منزّله من هنا.</p>
      <div id="recent-list"></div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, showEmpty, showError, showToast, initIcons, timeAgo } from '../assets/js/utils.js';
    import { notifyStudents } from '../assets/js/push.js';

    async function init() {
      const ok = await protectAdminPage();
      if (!ok) return;
      document.documentElement.classList.remove('admin-auth-pending');
      initIcons();
      document.getElementById('notif-form').addEventListener('submit', onSend);
      await loadRecent();
    }

    function onSend(e) {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      let link = document.getElementById('link').value.trim() || '/notifications.html';
      const type = document.getElementById('type').value || 'info';

      if (!title || !body) {
        showToast('اكتب العنوان والنص.', 'error');
        return;
      }

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = 'جاري الإرسال...';

      (async () => {
        try {
          const { data, error } = await supabase
            .from('notifications')
            .insert({
              title,
              body,
              type,
              link,
              is_global: true,
              user_id: null
            })
            .select('id')
            .maybeSingle();

          if (error) {
            console.error(error);
            showToast(
              error.message?.includes('relation') || error.code === '42P01'
                ? 'جدول الإشعارات مش موجود. نفّذ supabase/schema.sql أو fix_notifications.sql'
                : (error.message || 'فشل حفظ الإشعار'),
              'error'
            );
            return;
          }

          const pushResult = await notifyStudents({ title, body, url: link });
          if (pushResult?.ok) {
            showToast('تم الإرسال — هيظهر في لوحة الإشعارات وعلى الأجهزة المشتركة', 'success');
          } else {
            showToast('تم حفظ الإشعار في اللوحة. إشعار الهاتف يحتاج تفعيل Push (Edge Function)', 'success');
          }

          e.target.reset();
          await loadRecent();
        } finally {
          btn.disabled = false;
          btn.textContent = prev;
        }
      })();
    }

    async function loadRecent() {
      const el = document.getElementById('recent-list');
      try {
        const { data, error } = await supabase
          .from('notifications')
          .select('id, title, body, type, link, is_global, created_at')
          .eq('is_global', true)
          .order('created_at', { ascending: false })
          .limit(20);

        if (error) throw error;
        if (!data?.length) {
          showEmpty(el, 'لسه مفيش إشعارات مرسلة');
          return;
        }

        el.innerHTML = data
          .map(
            (n) => `
          <article class="card mb-2">
            <div class="flex justify-between items-start gap-1 flex-wrap">
              <div style="min-width:0;flex:1">
                <div class="flex items-center gap-1 flex-wrap">
                  <h3 class="card-title" style="margin:0">${escapeHtml(n.title || '')}</h3>
                  <span class="badge">${escapeHtml(n.type || 'info')}</span>
                </div>
                <p class="text-sm text-muted mt-1">${escapeHtml(n.body || '')}</p>
                <p class="text-sm text-muted mt-1">${escapeHtml(timeAgo(n.created_at))}${n.link ? ' · ' + escapeHtml(n.link) : ''}</p>
              </div>
              <button type="button" class="btn btn-sm btn-danger" data-delete="${escapeHtml(n.id)}" title="حذف الإشعار">حذف</button>
            </div>
          </article>`
          )
          .join('');

        el.querySelectorAll('[data-delete]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.delete;
            if (!id) return;
            if (!confirm('متأكد تحذف الإشعار ده؟ مش هيبان للطلاب تاني.')) return;
            btn.disabled = true;
            try {
              const { error } = await supabase.from('notifications').delete().eq('id', id);
              if (error) {
                showToast(error.message || 'تعذر حذف الإشعار. تأكد من صلاحيات الأدمن.', 'error');
                return;
              }
              showToast('تم حذف الإشعار.', 'success');
              await loadRecent();
            } catch (err) {
              console.error(err);
              showToast('تعذر حذف الإشعار.', 'error');
            } finally {
              btn.disabled = false;
            }
          });
        });
      } catch (err) {
        console.error(err);
        showError(el, 'تعذر تحميل الإشعارات السابقة. تأكد من وجود جدول notifications وصلاحيات الأدمن.');
      }
    }

    init();
  </script>
</body>
</html>
