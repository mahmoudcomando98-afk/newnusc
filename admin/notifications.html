<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إرسال إشعارات | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=push-4" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=push-4" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الإشعارات</span>
      </a>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content" style="max-width:640px">
      <h1 class="mb-2" style="font-size:1.25rem">إرسال إشعار للطلاب</h1>
      <p class="text-sm text-muted mb-2">
        الإشعار يتحفظ في لوحة كل الطلاب. شريط التليفون يوصل فقط لمن فعّل إشعارات المتصفح.
      </p>

      <div class="card mb-3" id="push-stats" style="padding:12px 14px">
        <p class="text-sm" style="margin:0">
          أجهزة مفعّلة لإشعارات التليفون:
          <strong id="device-count">…</strong>
        </p>
      </div>

      <div id="send-result" class="card mb-3 hidden" style="padding:12px 14px;border-color:var(--primary,#c45c26)"></div>

      <div class="card mb-3">
        <form id="notif-form">
          <div class="form-group">
            <label class="form-label" for="title">عنوان الإشعار *</label>
            <input type="text" id="title" class="form-input" required maxlength="120" placeholder="مثال: تذكير بموعد الكويز" />
          </div>
          <div class="form-group">
            <label class="form-label" for="body">نص الإشعار *</label>
            <textarea id="body" class="form-textarea" required maxlength="500" rows="4" placeholder="اكتب الرسالة باختصار ووضوح"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="link">رابط عند الضغط (اختياري)</label>
            <input type="text" id="link" class="form-input" dir="ltr" maxlength="500" placeholder="/quizzes.html أو https://..." />
            <p class="text-sm text-muted mt-1">لو سيبته فاضي، هيفتح صفحة الإشعارات.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="type">النوع</label>
            <select id="type" class="form-select">
              <option value="info">عام</option>
              <option value="warning">تنبيه</option>
              <option value="success">مهم / إيجابي</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" id="send-btn">إرسال لجميع الطلاب</button>
        </form>
      </div>

      <h2 class="mb-2" style="font-size:1.05rem">آخر الإشعارات</h2>
      <div id="list"></div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, showEmpty, showError, showToast, initIcons, timeAgo } from '../assets/js/utils.js';
    import { sendPushToAll, countPushDevices } from '../assets/js/push.js';

    async function refreshDeviceCount() {
      const el = document.getElementById('device-count');
      if (!el) return;
      const n = await countPushDevices();
      el.textContent = n == null ? '—' : String(n);
    }

    function showSendResult(html) {
      const box = document.getElementById('send-result');
      if (!box) return;
      box.classList.remove('hidden');
      box.innerHTML = html;
    }

    async function init() {
      const ok = await protectAdminPage();
      if (!ok) return;
      document.documentElement.classList.remove('admin-auth-pending');
      initIcons();
      document.getElementById('notif-form').addEventListener('submit', onSend);
      await Promise.all([loadRecent(), refreshDeviceCount()]);
    }

    async function onSend(e) {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      let link = document.getElementById('link').value.trim() || '/notifications.html';
      const type = document.getElementById('type').value || 'info';

      if (!title || !body) {
        showToast('اكتب العنوان والنص.', 'error');
        return;
      }

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = 'جاري الإرسال...';

      try {
        const { error } = await supabase
          .from('notifications')
          .insert({
            title,
            body,
            type,
            link,
            is_global: true,
            user_id: null
          })
          .select('id')
          .maybeSingle();

        if (error) {
          console.error(error);
          showToast(
            error.message?.includes('relation') || error.code === '42P01'
              ? 'جدول الإشعارات مش موجود. نفّذ supabase/schema.sql أو fix_notifications.sql'
              : (error.message || 'فشل حفظ الإشعار'),
            'error'
          );
          return;
        }

        const pushResult = await sendPushToAll({ title, body, url: link });
        const sent = pushResult?.sent ?? 0;
        const total = pushResult?.total ?? 0;
        const failed = pushResult?.failed ?? 0;

        if (pushResult?.ok) {
          if (total === 0) {
            showSendResult(`
              <p style="margin:0 0 6px"><strong>اتحفظت الرسالة في لوحة كل الطلاب.</strong></p>
              <p class="text-sm text-muted" style="margin:0">إشعار التليفون: مفيش أجهزة مفعّلة لسه. اطلب من الطلاب تفعيل الإشعارات من الرئيسية.</p>
            `);
            showToast('اتحفظت في اللوحة — مفيش أجهزة تليفون مفعّلة', 'info');
          } else {
            showSendResult(`
              <p style="margin:0 0 6px"><strong>الرسالة وصلت لـ ${sent} من ${total} جهاز</strong></p>
              <p class="text-sm text-muted" style="margin:0">
                اتحفظت كمان في لوحة إشعارات كل الطلاب.
                ${failed ? 'فشل على ' + failed + ' جهاز (اشتراكات قديمة اتشالت تلقائي).' : ''}
              </p>
            `);
            showToast('الرسالة وصلت لـ ' + sent + ' من ' + total + ' جهاز', 'success');
          }
        } else {
          showSendResult(`
            <p style="margin:0 0 6px"><strong>اتحفظت في لوحة الطلاب.</strong></p>
            <p class="text-sm text-muted" style="margin:0">إشعار التليفون فشل: ${escapeHtml(pushResult?.error || 'غير معروف')}</p>
          `);
          showToast('اتحفظت في اللوحة. التليفون فشل — راجع send-push', 'info');
        }

        document.getElementById('notif-form').reset();
        await Promise.all([loadRecent(), refreshDeviceCount()]);
      } catch (err) {
        console.error(err);
        showToast(err.message || 'حصل خطأ أثناء الإرسال.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    async function deleteNotification(id, button) {
      if (!id || !confirm('تحذف الإشعار ده؟')) return;
      button.disabled = true;
      try {
        const { error } = await supabase.from('notifications').delete().eq('id', id);
        if (error) {
          showToast(error.message || 'تعذر حذف الإشعار.', 'error');
          return;
        }
        showToast('تم حذف الإشعار.', 'success');
        await loadRecent();
      } catch (err) {
        console.error(err);
        showToast('تعذر حذف الإشعار.', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function loadRecent() {
      const el = document.getElementById('list');
      try {
        let result = await supabase
          .from('notifications')
          .select('id, title, body, type, link, created_at, is_global')
          .order('created_at', { ascending: false })
          .limit(30);

        if (result.error && /is_global|link/i.test(String(result.error.message || ''))) {
          result = await supabase
            .from('notifications')
            .select('id, title, body, type, created_at')
            .order('created_at', { ascending: false })
            .limit(30);
        }
        if (result.error) throw result.error;

        const rows = result.data || [];
        if (!rows.length) {
          showEmpty(el, 'لسه مفيش إشعارات مرسلة.');
          return;
        }

        el.innerHTML = rows
          .map(
            (n) => `
          <article class="card mb-2">
            <div class="flex justify-between items-start gap-1">
              <div>
                <h3 class="card-title" style="margin:0;font-size:0.95rem">${escapeHtml(n.title || '')}</h3>
                <p class="text-sm text-muted mt-1">${escapeHtml((n.body || '').slice(0, 160))}</p>
                <p class="text-sm text-muted">${escapeHtml(timeAgo(n.created_at))}</p>
              </div>
              <button type="button" class="btn btn-sm btn-danger" data-delete="${escapeHtml(n.id)}">حذف</button>
            </div>
          </article>`
          )
          .join('');

        el.querySelectorAll('[data-delete]').forEach((btn) => {
          btn.addEventListener('click', () => deleteNotification(btn.dataset.delete, btn));
        });
      } catch (err) {
        console.error(err);
        showError(el, 'تعذر تحميل الإشعارات السابقة.');
      }
    }

    init();
  </script>
</body>
</html>
