<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إدارة الطلاب | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=ui-polish-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=ui-polish-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الطلاب</span>
      </a>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content">
      <h1 class="mb-2" style="font-size:1.25rem">الطلاب المسجلون</h1>
      <p class="text-sm text-muted mb-3">ابحث بالاسم أو البريد، غيّر كلمة المرور، أو احظر طالب.</p>

      <div class="toolbar subjects-toolbar mb-3">
        <input
          type="search"
          id="search"
          class="form-input"
          placeholder="ابحث بالاسم أو البريد الإلكتروني…"
          autocomplete="off"
          aria-label="بحث عن طالب"
        />
        <select id="filter-status" class="form-select" style="max-width:160px" aria-label="تصفية الحالة">
          <option value="all">الكل</option>
          <option value="active">نشط</option>
          <option value="banned">محظور</option>
        </select>
      </div>

      <div class="flex justify-between items-center flex-wrap gap-1 mb-2">
        <p class="text-sm text-muted" id="count-label" style="margin:0">—</p>
        <button type="button" class="btn btn-sm btn-outline" id="export-btn">تصدير CSV</button>
      </div>
      <div id="list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import {
      escapeHtml,
      formatDate,
      showEmpty,
      showError,
      showToast,
      initIcons
    } from '../assets/js/utils.js';

    let students = [];
    let meId = null;

    async function init() {
      const result = await protectAdminPage();
      if (!result) return;
      meId = result.user?.id || result.profile?.id || null;
      document.documentElement.classList.remove('admin-auth-pending');
      initIcons();

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('filter-status').addEventListener('change', render);
      document.getElementById('export-btn')?.addEventListener('click', exportCsv);

      await load();
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('id, full_name, email, student_id, role, is_active, created_at')
          .order('created_at', { ascending: false });

        if (error) throw error;
        students = data || [];
        render();
      } catch (err) {
        console.error(err);
        showError(el, 'تعذر تحميل قائمة الطلاب. تأكد من صلاحيات الأدمن على جدول profiles.');
      }
    }

    function render() {
      const el = document.getElementById('list');
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      const status = document.getElementById('filter-status').value;

      let rows = students.slice();
      if (q) {
        rows = rows.filter((p) =>
          [p.full_name, p.email, p.student_id].some((v) => String(v || '').toLowerCase().includes(q))
        );
      }
      if (status === 'active') rows = rows.filter((p) => p.is_active !== false);
      if (status === 'banned') rows = rows.filter((p) => p.is_active === false);

      const bannedCount = students.filter((p) => p.is_active === false).length;

      document.getElementById('count-label').textContent =
        `عرض ${rows.length} من ${students.length}` +
        (bannedCount ? ` · محظورون: ${bannedCount}` : '');

      if (!rows.length) {
        showEmpty(el, 'لا توجد نتائج مطابقة للبحث');
        return;
      }

      el.innerHTML = `<div class="card">${rows
        .map((p) => {
          const active = p.is_active !== false;
          const isSelf = meId && p.id === meId;
          const isAdminRole = p.role === 'admin' || p.role === 'moderator';
          const canBan = !isSelf && !isAdminRole;
          const canResetPass = !isAdminRole || isSelf;

          return `
          <div class="list-item" data-id="${escapeHtml(p.id)}">
            <div class="list-item-body">
              <div class="list-item-title">${escapeHtml(p.full_name || '—')}</div>
              <div class="list-item-desc">
                ${escapeHtml(p.email || '')}
                ${p.student_id ? ' · ' + escapeHtml(p.student_id) : ''}
                · <span class="badge ${isAdminRole ? 'badge-danger' : 'badge-primary'}">${escapeHtml(p.role || 'student')}</span>
                · <span class="badge ${active ? 'badge-success' : 'badge-danger'}">${active ? 'نشط' : 'محظور'}</span>
                ${p.created_at ? ' · ' + escapeHtml(formatDate(p.created_at)) : ''}
              </div>
            </div>
            <div class="flex gap-1 items-center" style="flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
              ${canResetPass
                ? `<button type="button" class="btn btn-sm btn-outline" data-pass="${escapeHtml(p.id)}" data-name="${escapeHtml(p.full_name || p.email || '')}">باسورد</button>`
                : ''}
              ${canBan
                ? active
                  ? `<button type="button" class="btn btn-sm btn-danger" data-ban="${escapeHtml(p.id)}">حظر</button>`
                  : `<button type="button" class="btn btn-sm btn-secondary" data-unban="${escapeHtml(p.id)}">فك الحظر</button>`
                : isSelf
                  ? '<span class="text-sm text-muted">أنت</span>'
                  : ''}
            </div>
          </div>`;
        })
        .join('')}</div>`;

      el.querySelectorAll('[data-ban]').forEach((btn) => {
        btn.addEventListener('click', () => setBanned(btn.dataset.ban, true));
      });
      el.querySelectorAll('[data-unban]').forEach((btn) => {
        btn.addEventListener('click', () => setBanned(btn.dataset.unban, false));
      });
      el.querySelectorAll('[data-pass]').forEach((btn) => {
        btn.addEventListener('click', () => resetPassword(btn.dataset.pass, btn.dataset.name || ''));
      });
      initIcons();
    }

    async function resetPassword(userId, displayName) {
      if (!userId) return;
      const label = displayName || 'الطالب';
      const pwd = prompt('كلمة مرور جديدة لـ «' + label + '» (6 حروف على الأقل):');
      if (pwd == null) return;
      const trimmed = String(pwd).trim();
      if (trimmed.length < 6) {
        showToast('كلمة المرور لازم 6 حروف على الأقل.', 'error');
        return;
      }
      if (!confirm('تأكيد تغيير كلمة المرور لـ «' + label + '»؟')) return;

      try {
        const { data: sessionData } = await supabase.auth.getSession();
        const token = sessionData?.session?.access_token;
        if (!token) {
          showToast('سجّل دخول كأدمن من جديد.', 'error');
          return;
        }

        const { data, error } = await supabase.functions.invoke('admin-set-password', {
          body: { user_id: userId, password: trimmed }
        });

        if (error) throw error;
        if (data?.error) throw new Error(data.error);

        showToast('تم تغيير كلمة المرور.', 'success');
      } catch (err) {
        console.error(err);
        const msg = String(err?.message || err || '');
        if (/Failed to send|FunctionsFetchError|not found|404/i.test(msg)) {
          showToast('الدالة مش منشورة. نفّذ: npx supabase functions deploy admin-set-password --no-verify-jwt', 'error');
        } else {
          showToast(msg || 'تعذر تغيير كلمة المرور', 'error');
        }
      }
    }

    function exportCsv() {
      const status = document.getElementById('filter-status').value;
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      let rows = students.slice();
      if (q) {
        rows = rows.filter((p) =>
          [p.full_name, p.email, p.student_id].some((v) => String(v || '').toLowerCase().includes(q))
        );
      }
      if (status === 'active') rows = rows.filter((p) => p.is_active !== false);
      if (status === 'banned') rows = rows.filter((p) => p.is_active === false);
      if (!rows.length) {
        showToast('مفيش بيانات للتصدير.', 'info');
        return;
      }
      const header = ['name', 'email', 'student_id', 'role', 'status', 'created_at'];
      const lines = [header.join(',')];
      rows.forEach((p) => {
        const cells = [
          p.full_name || '',
          p.email || '',
          p.student_id || '',
          p.role || 'student',
          p.is_active === false ? 'banned' : 'active',
          p.created_at || ''
        ].map((c) => '"' + String(c).replace(/"/g, '""') + '"');
        lines.push(cells.join(','));
      });
      const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nusc-students.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('تم تصدير الملف.', 'success');
    }

    async function setBanned(userId, ban) {
      if (!userId) return;
      const action = ban ? 'حظر' : 'فك حظر';
      if (!confirm(ban ? 'هل تريد حظر هذا الطالب من المنصة؟' : 'هل تريد فك الحظر عن هذا الطالب؟')) return;

      try {
        const { error } = await supabase
          .from('profiles')
          .update({ is_active: !ban })
          .eq('id', userId);

        if (error) throw error;

        const row = students.find((s) => s.id === userId);
        if (row) row.is_active = !ban;

        showToast(ban ? 'تم حظر الطالب' : 'تم فك الحظر', 'success');
        render();
      } catch (err) {
        console.error(err);
        showToast(err.message || `تعذر ${action} الطالب`, 'error');
      }
    }

    init();
  </script>
</body>
</html>
