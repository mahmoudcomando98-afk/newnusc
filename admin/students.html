<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إدارة الطلاب | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=ui-polish-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=ui-polish-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الطلاب</span>
      </a>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content">
      <h1 class="mb-2" style="font-size:1.25rem">الطلاب المسجلون</h1>
      <p class="text-sm text-muted mb-3">ابحث بالاسم أو البريد، واحظر أو فك الحظر عن أي طالب.</p>

      <div class="toolbar subjects-toolbar mb-3">
        <input
          type="search"
          id="search"
          class="form-input"
          placeholder="ابحث بالاسم أو البريد الإلكتروني…"
          autocomplete="off"
          aria-label="بحث عن طالب"
        />
        <select id="filter-status" class="form-select" style="max-width:160px" aria-label="تصفية الحالة">
          <option value="all">الكل</option>
          <option value="active">نشط</option>
          <option value="banned">محظور</option>
        </select>
      </div>

      <p class="text-sm text-muted mb-2" id="count-label">—</p>
      <div id="list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import {
      escapeHtml,
      formatDate,
      showEmpty,
      showError,
      showToast,
      initIcons
    } from '../assets/js/utils.js';

    let students = [];
    let meId = null;

    async function init() {
      const result = await protectAdminPage();
      if (!result) return;
      meId = result.user?.id || result.profile?.id || null;
      document.documentElement.classList.remove('admin-auth-pending');
      initIcons();

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('filter-status').addEventListener('change', render);

      await load();
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('id, full_name, email, student_id, role, is_active, created_at')
          .order('created_at', { ascending: false })
          .limit(500);

        if (error) throw error;
        students = data || [];
        render();
      } catch (err) {
        console.error(err);
        showError(el, 'تعذر تحميل قائمة الطلاب. تأكد من صلاحيات الأدمن على جدول profiles.');
      }
    }

    function filtered() {
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      const status = document.getElementById('filter-status').value;

      return students.filter((p) => {
        const active = p.is_active !== false;
        if (status === 'active' && !active) return false;
        if (status === 'banned' && active) return false;

        if (!q) return true;
        const name = String(p.full_name || '').toLowerCase();
        const email = String(p.email || '').toLowerCase();
        const sid = String(p.student_id || '').toLowerCase();
        return name.includes(q) || email.includes(q) || sid.includes(q);
      });
    }

    function render() {
      const el = document.getElementById('list');
      const rows = filtered();
      const bannedCount = students.filter((p) => p.is_active === false).length;

      document.getElementById('count-label').textContent =
        `عرض ${rows.length} من ${students.length}` +
        (bannedCount ? ` · محظورون: ${bannedCount}` : '');

      if (!rows.length) {
        showEmpty(el, 'لا توجد نتائج مطابقة للبحث');
        return;
      }

      el.innerHTML = `<div class="card">${rows
        .map((p) => {
          const active = p.is_active !== false;
          const isSelf = meId && p.id === meId;
          const isAdminRole = p.role === 'admin' || p.role === 'moderator';
          const canBan = !isSelf && !isAdminRole;

          return `
          <div class="list-item" data-id="${escapeHtml(p.id)}">
            <div class="list-item-body">
              <div class="list-item-title">${escapeHtml(p.full_name || '—')}</div>
              <div class="list-item-desc">
                ${escapeHtml(p.email || '')}
                ${p.student_id ? ' · ' + escapeHtml(p.student_id) : ''}
                · <span class="badge ${isAdminRole ? 'badge-danger' : 'badge-primary'}">${escapeHtml(p.role || 'student')}</span>
                · <span class="badge ${active ? 'badge-success' : 'badge-danger'}">${active ? 'نشط' : 'محظور'}</span>
                ${p.created_at ? ' · ' + escapeHtml(formatDate(p.created_at)) : ''}
              </div>
            </div>
            <div class="flex gap-1 items-center" style="flex-shrink:0">
              ${canBan
                ? active
                  ? `<button type="button" class="btn btn-sm btn-danger" data-ban="${escapeHtml(p.id)}">حظر</button>`
                  : `<button type="button" class="btn btn-sm btn-secondary" data-unban="${escapeHtml(p.id)}">فك الحظر</button>`
                : isSelf
                  ? '<span class="text-sm text-muted">أنت</span>'
                  : ''}
            </div>
          </div>`;
        })
        .join('')}</div>`;

      el.querySelectorAll('[data-ban]').forEach((btn) => {
        btn.addEventListener('click', () => setBanned(btn.dataset.ban, true));
      });
      el.querySelectorAll('[data-unban]').forEach((btn) => {
        btn.addEventListener('click', () => setBanned(btn.dataset.unban, false));
      });
      initIcons();
    }

    async function setBanned(userId, ban) {
      if (!userId) return;
      const action = ban ? 'حظر' : 'فك حظر';
      if (!confirm(ban ? 'هل تريد حظر هذا الطالب من المنصة؟' : 'هل تريد فك الحظر عن هذا الطالب؟')) return;

      try {
        const { error } = await supabase
          .from('profiles')
          .update({ is_active: !ban })
          .eq('id', userId);

        if (error) throw error;

        const row = students.find((s) => s.id === userId);
        if (row) row.is_active = !ban;

        showToast(ban ? 'تم حظر الطالب' : 'تم فك الحظر', 'success');
        render();
      } catch (err) {
        console.error(err);
        showToast(err.message || `تعذر ${action} الطالب`, 'error');
      }
    }

    init();
  </script>
</body>
</html>
