<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>إعلانات المواد | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>إعلانات المواد</span>
      </a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ إعلان جديد</button>
    </div>
  </header>
  <main class="page" style="padding-bottom:24px">
    <div class="container page-content">
      <p class="text-sm text-muted mb-2">اختار «كل المنصة» لإعلان عام، أو اختار مادة عشان الإعلان يظهر داخل صفحة المادة وفي الإشعارات.</p>
      <div id="form-panel" class="card mb-3 hidden">
        <form id="ann-form">
          <div class="form-group"><label class="form-label" for="title">عنوان الإعلان *</label><input type="text" id="title" class="form-input" required maxlength="180" /></div>
          <div class="form-group">
            <label class="form-label" for="subject_id">الإعلان موجّه لمين؟</label>
            <select id="subject_id" class="form-select">
              <option value="">كل المنصة</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label" for="content">محتوى الإعلان *</label><textarea id="content" class="form-textarea" required maxlength="10000"></textarea></div>
          <div class="form-group"><label class="form-label" for="importance">الأهمية</label>
            <select id="importance" class="form-select"><option value="normal">عادي</option><option value="high">مهم</option><option value="urgent">عاجل</option><option value="low">أهمية قليلة</option></select>
          </div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_pinned" /><span>تثبيت الإعلان</span></label></div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_published" checked /><span>نشر الإعلان فورًا</span></label></div>
          <div class="flex gap-1"><button type="submit" class="btn btn-primary">نشر الإعلان</button><button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button></div>
        </form>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, timeAgo, showEmpty, showError, showToast, withLoading, initIcons } from '../assets/js/utils.js';

    let subjectsById = new Map();
    let currentProfile = null;

    async function init() {
      const result = await protectAdminPage();
      if (!result) return;
      currentProfile = result.profile || null;
      initIcons();
      document.getElementById('add-btn').addEventListener('click', () => document.getElementById('form-panel').classList.remove('hidden'));
      document.getElementById('cancel-btn').addEventListener('click', () => document.getElementById('form-panel').classList.add('hidden'));
      document.getElementById('ann-form').addEventListener('submit', save);
      await loadSubjects();
      await load();
    }

    async function loadSubjects() {
      const { data, error } = await supabase.from('subjects').select('id, name').order('name');
      if (error) throw error;
      const select = document.getElementById('subject_id');
      (data || []).forEach((subject) => {
        subjectsById.set(subject.id, subject.name);
        const option = document.createElement('option');
        option.value = subject.id;
        option.textContent = subject.name;
        select.appendChild(option);
      });
    }

    function importanceOf(item) { return item.importance || item.priority || 'normal'; }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase.from('announcements').select('*').order('created_at', { ascending: false }).limit(100);
        if (error) throw error;
        if (!data?.length) { showEmpty(el, 'لسه مفيش إعلانات. اضغط «إعلان جديد» عشان تبدأ.'); return; }
        el.innerHTML = data.map((item) => {
          const subjectName = item.subject_id ? (subjectsById.get(item.subject_id) || 'إعلان لمادة') : 'كل المنصة';
          const level = importanceOf(item);
          const levelLabel = level === 'urgent' ? 'عاجل' : level === 'high' ? 'مهم' : level === 'low' ? 'أهمية قليلة' : 'عادي';
          return `<article class="card mb-2">
            <div class="flex justify-between items-center flex-wrap gap-1">
              <div>
                <h3 class="card-title">${item.is_pinned ? '📌 ' : ''}${escapeHtml(item.title || 'إعلان')}</h3>
                <p class="text-sm text-muted">${escapeHtml(subjectName)} · ${levelLabel} · ${timeAgo(item.created_at)}</p>
                <p class="text-sm mt-1">${escapeHtml((item.content || item.body || '').slice(0, 160))}</p>
              </div>
              <div class="flex gap-1 items-center">
                <span class="badge ${item.is_published === false ? 'badge-warning' : 'badge-success'}">${item.is_published === false ? 'مسودة' : 'منشور'}</span>
                <button type="button" class="btn btn-sm btn-danger" data-del="${item.id}">حذف</button>
              </div>
            </div>
          </article>`;
        }).join('');
        el.querySelectorAll('[data-del]').forEach((button) => button.addEventListener('click', async () => {
          if (!confirm('متأكد إنك عايز تحذف الإعلان ده؟')) return;
          const { error: deleteError } = await supabase.from('announcements').delete().eq('id', button.dataset.del);
          if (deleteError) { showToast(deleteError.message, 'error'); return; }
          showToast('الإعلان اتحذف.', 'success');
          await load();
        }));
      } catch (error) {
        console.error('Announcement management load failed:', error);
        showError(el, 'مش قادرين نحمّل الإعلانات. راجع اتصال قاعدة البيانات والصلاحيات.');
      }
    }

    function isMissingColumn(error, column) {
      const message = String(error?.message || '').toLowerCase();
      const details = String(error?.details || '').toLowerCase();
      const combined = message + ' ' + details;
      return combined.includes(`could not find the '${column.toLowerCase()}' column`) ||
        combined.includes(`column "${column.toLowerCase()}" does not exist`) ||
        combined.includes(`column ${column.toLowerCase()} does not exist`) ||
        combined.includes(`announcements.${column.toLowerCase()}`);
    }

    async function insertAnnouncement(payload) {
      const candidate = { ...payload };
      // Select the inserted row so the UI only reports success after Postgres confirms persistence.
      for (let attempt = 0; attempt < 6; attempt += 1) {
        const result = await supabase.from('announcements')
          .insert(candidate)
          .select('id, title, subject_id')
          .single();
        if (!result.error) return result;

        // Support deployments whose old schema used priority rather than importance.
        if (isMissingColumn(result.error, 'importance') && Object.hasOwn(candidate, 'importance')) {
          candidate.priority = candidate.importance;
          delete candidate.importance;
          continue;
        }
        if (isMissingColumn(result.error, 'priority') && Object.hasOwn(candidate, 'priority')) {
          delete candidate.priority;
          continue;
        }

        // These are optional metadata fields on older installs. Never drop subject_id,
        // title, or content: a targeted announcement must not silently become global.
        const optionalColumns = ['is_pinned', 'is_published', 'created_by'];
        const missingOptional = optionalColumns.find(column =>
          Object.hasOwn(candidate, column) && isMissingColumn(result.error, column)
        );
        if (missingOptional) {
          delete candidate[missingOptional];
          continue;
        }
        return result;
      }
      return { data: null, error: { message: 'تعذر حفظ الإعلان بسبب اختلاف أعمدة جدول الإعلانات.' } };
    }

    function announcementSaveError(error) {
      const message = String(error?.message || '');
      if (error?.code === '42501' || /row-level security|permission denied|not allowed/i.test(message)) {
        return 'قاعدة البيانات رفضت الحفظ بسبب الصلاحيات. شغّل ملف fix_announcements_and_branding.sql في Supabase SQL Editor.';
      }
      if (/column|schema cache|42703|pgrst204/i.test(message)) {
        return 'جدول الإعلانات محتاج تحديث. شغّل ملف fix_announcements_and_branding.sql في Supabase SQL Editor.';
      }
      return 'فشل حفظ الإعلان: ' + (message || 'خطأ غير معروف');
    }

    async function save(event) {
      event.preventDefault();
      const button = event.target.querySelector('[type=submit]');
      await withLoading(button, async () => {
        const payload = {
          title: document.getElementById('title').value.trim(),
          content: document.getElementById('content').value.trim(),
          subject_id: document.getElementById('subject_id').value || null,
          importance: document.getElementById('importance').value,
          is_pinned: document.getElementById('is_pinned').checked,
          is_published: document.getElementById('is_published').checked,
          created_by: currentProfile?.id || null
        };
        const { data: savedAnnouncement, error } = await insertAnnouncement(payload);
        if (error || !savedAnnouncement?.id) {
          console.error('Announcement insert was not confirmed:', error);
          showToast(announcementSaveError(error || { message: 'لم يتم تأكيد حفظ الإعلان.' }), 'error');
          return;
        }
        console.info('Announcement saved:', savedAnnouncement.id);
        showToast('تم حفظ الإعلان بنجاح.', 'success');
        document.getElementById('form-panel').classList.add('hidden');
        event.target.reset();
        await load();
      });
    }

    init().catch((error) => {
      console.error('Announcement admin setup failed:', error);
      showError(document.getElementById('list'), 'مش قادرين نجهّز صفحة الإعلانات. راجع صلاحيات الإدارة وقاعدة البيانات.');
    });
  </script>
</body>
</html>
