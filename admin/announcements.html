<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إعلانات المواد | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=neutral-v2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=neutral-v2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>إعلانات المواد</span>
      </a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ إعلان جديد</button>
    </div>
  </header>
  <main class="page" style="padding-bottom:24px">
    <div class="container page-content">
      <p class="text-sm text-muted mb-2">اختار «كل المنصة» لإعلان عام، أو اختار مادة عشان الإعلان يظهر داخل صفحة المادة وفي الإشعارات.</p>
      <div id="form-panel" class="card mb-3 hidden">
        <form id="ann-form">
          <div class="form-group"><label class="form-label" for="title">عنوان الإعلان *</label><input type="text" id="title" class="form-input" required maxlength="180" /></div>
          <div class="form-group">
            <label class="form-label" for="subject_id">الإعلان موجّه لمين؟</label>
            <select id="subject_id" class="form-select">
              <option value="">كل المنصة</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label" for="content">محتوى الإعلان *</label><textarea id="content" class="form-textarea" required maxlength="10000"></textarea></div>
          <div class="form-group">
            <label class="form-label" for="link_url">رابط الدخول (اختياري)</label>
            <input type="url" id="link_url" class="form-input" maxlength="2000" placeholder="https://..." inputmode="url" dir="ltr" />
            <p class="text-sm text-muted mt-1">أضف رابط Zoom أو Google Meet أو أي رابط. تقدر تسيبه فاضي.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="link_label">نص زر الرابط</label>
            <input type="text" id="link_label" class="form-input" maxlength="60" placeholder="دخول السيكشن أونلاين" />
          </div>
          <div class="form-group">
            <label class="form-label" for="link_status">حالة الرابط</label>
            <select id="link_status" class="form-select">
              <option value="available">متاح</option>
              <option value="soon">قريبًا</option>
              <option value="none">بدون رابط</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label" for="importance">الأهمية</label>
            <select id="importance" class="form-select"><option value="normal">عادي</option><option value="high">مهم</option><option value="urgent">عاجل</option><option value="low">أهمية قليلة</option></select>
          </div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_pinned" /><span>تثبيت الإعلان</span></label></div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_published" checked /><span>نشر الإعلان</span></label>
            <p class="text-sm text-muted mt-1">لو شلت العلامة = مسودة (مش ظاهرة للطلاب).</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="publish_at">جدولة الظهور (اختياري)</label>
            <input type="datetime-local" id="publish_at" class="form-input" />
            <p class="text-sm text-muted mt-1">حدد وقت ظهور الإعلان للطلاب. لو فاضي هيظهر فور النشر.</p>
          </div>
          <div class="flex gap-1"><button type="submit" class="btn btn-primary">حفظ الإعلان</button><button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button></div>
        </form>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, timeAgo, showEmpty, showError, showToast, withLoading, initIcons } from '../assets/js/utils.js';

    function formatDateTimeLocal(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    function readPublishState() {
      const published = document.getElementById('is_published')?.checked !== false;
      const raw = document.getElementById('publish_at')?.value || '';
      let publishAt = null;
      if (raw) {
        const d = new Date(raw);
        if (!Number.isNaN(d.getTime())) publishAt = d.toISOString();
      }
      return { is_published: published, publish_at: publishAt };
    }

    let subjectsById = new Map();
    let currentProfile = null;
    let editingId = null;
    const announcementsById = new Map();

    async function init() {
      const result = await protectAdminPage();
      if (!result) return;
      currentProfile = result.profile || null;
      initIcons();
      document.getElementById('add-btn').addEventListener('click', () => {
        resetForm();
        document.getElementById('form-panel').classList.remove('hidden');
        document.getElementById('title').focus();
      });
      document.getElementById('cancel-btn').addEventListener('click', () => {
        resetForm();
        document.getElementById('form-panel').classList.add('hidden');
      });
      document.getElementById('link_url').addEventListener('input', () => {
        document.getElementById('link_status').disabled = Boolean(document.getElementById('link_url').value.trim());
      });
      document.getElementById('ann-form').addEventListener('submit', save);
      await loadSubjects();
      await load();
    }

    async function loadSubjects() {
      const { data, error } = await supabase.from('subjects').select('id, name').order('name');
      if (error) throw error;
      const select = document.getElementById('subject_id');
      (data || []).forEach((subject) => {
        subjectsById.set(String(subject.id), subject.name);
        const opt = document.createElement('option');
        opt.value = subject.id;
        opt.textContent = subject.name;
        select.appendChild(opt);
      });
    }

    async function persistAnnouncement(candidate, announcementId) {
      const optionalColumns = ['is_pinned', 'is_published', 'publish_at', 'created_by', 'link_url', 'link_label', 'link_status', 'importance', 'subject_id'];
      let payload = { ...candidate };
      for (let attempt = 0; attempt < 8; attempt++) {
        const query = announcementId
          ? supabase.from('announcements').update(payload).eq('id', announcementId).select('id').maybeSingle()
          : supabase.from('announcements').insert(payload).select('id').maybeSingle();
        const { data, error } = await query;
        if (!error) return { data, error: null };
        const msg = String(error.message || '');
        const hit = optionalColumns.find((col) => msg.includes(col));
        if (hit && hit in payload) {
          delete payload[hit];
          continue;
        }
        return { data: null, error };
      }
      return { data: null, error: { message: 'تعذر حفظ الإعلان' } };
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase
          .from('announcements')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(80);
        if (error) throw error;
        announcementsById.clear();
        (data || []).forEach((item) => announcementsById.set(String(item.id), item));
        if (!data?.length) {
          showEmpty(el, 'مفيش إعلانات لسه.');
          return;
        }
        el.innerHTML = `<div class="card">${data
          .map((item) => {
            const scheduled =
              item.is_published !== false &&
              item.publish_at &&
              new Date(item.publish_at).getTime() > Date.now();
            const statusLabel =
              item.is_published === false
                ? 'مسودة'
                : scheduled
                  ? 'مجدول ' +
                    new Date(item.publish_at).toLocaleString('ar-EG', {
                      dateStyle: 'short',
                      timeStyle: 'short'
                    })
                  : 'منشور';
            const statusClass =
              item.is_published === false || scheduled ? 'badge-warning' : 'badge-success';
            const subjectName = item.subject_id
              ? subjectsById.get(String(item.subject_id)) || 'مادة'
              : 'كل المنصة';
            return `
            <div class="list-item">
              <div class="list-item-body" style="flex:1">
                <div class="list-item-title">${escapeHtml(item.title || 'إعلان')}</div>
                <div class="list-item-desc">${escapeHtml(subjectName)} · ${timeAgo(item.created_at)}</div>
              </div>
              <div class="flex gap-1 items-center">
                <span class="badge ${statusClass}">${escapeHtml(statusLabel)}</span>
                <button type="button" class="btn btn-sm btn-secondary" data-edit="${escapeHtml(String(item.id))}">تعديل</button>
                <button type="button" class="btn btn-sm btn-outline" data-del="${escapeHtml(String(item.id))}">حذف</button>
              </div>
            </div>`;
          })
          .join('')}</div>`;
        el.querySelectorAll('[data-edit]').forEach((button) =>
          button.addEventListener('click', () => editAnnouncement(button.dataset.edit))
        );
        el.querySelectorAll('[data-del]').forEach((button) =>
          button.addEventListener('click', async () => {
            if (!confirm('متأكد إنك عايز تحذف الإعلان ده؟')) return;
            const { error: deleteError } = await supabase
              .from('announcements')
              .delete()
              .eq('id', button.dataset.del);
            if (deleteError) {
              showToast(deleteError.message, 'error');
              return;
            }
            showToast('الإعلان اتحذف.', 'success');
            await load();
          })
        );
      } catch (error) {
        console.error('Announcement management load failed:', error);
        showError(el, 'مش قادرين نحمّل الإعلانات. راجع اتصال قاعدة البيانات والصلاحيات.');
      }
    }

    function resetForm() {
      editingId = null;
      const form = document.getElementById('ann-form');
      form.reset();
      document.getElementById('is_published').checked = true;
      const patReset = document.getElementById('publish_at');
      if (patReset) patReset.value = '';
      document.getElementById('link_status').disabled = false;
      form.querySelector('[type=submit]').textContent = 'حفظ الإعلان';
    }

    function editAnnouncement(id) {
      const item = announcementsById.get(String(id));
      if (!item) {
        showToast('مش قادرين نفتح الإعلان للتعديل. حدّث الصفحة وجرب تاني.', 'error');
        return;
      }
      editingId = String(item.id);
      document.getElementById('title').value = item.title || '';
      document.getElementById('subject_id').value = item.subject_id || '';
      document.getElementById('content').value = item.content || item.body || '';
      document.getElementById('importance').value = item.importance || item.priority || 'normal';
      document.getElementById('is_pinned').checked = item.is_pinned === true;
      document.getElementById('is_published').checked = item.is_published !== false;
      const pat = document.getElementById('publish_at');
      if (pat) pat.value = formatDateTimeLocal(item.publish_at);
      document.getElementById('link_url').value = item.link_url || '';
      document.getElementById('link_label').value = item.link_label || '';
      document.getElementById('link_status').value = item.link_status || 'available';
      document.getElementById('link_status').disabled = Boolean(item.link_url);
      document.getElementById('form-panel').classList.remove('hidden');
      document.getElementById('ann-form').querySelector('[type=submit]').textContent = 'تحديث الإعلان';
      document.getElementById('title').focus();
    }

    async function save(event) {
      event.preventDefault();
      const button = event.target.querySelector('[type=submit]');
      await withLoading(button, async () => {
        const rawUrl = document.getElementById('link_url').value.trim();
        let linkUrl = '';
        if (rawUrl) {
          try {
            const parsed = new URL(rawUrl);
            if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('protocol');
            linkUrl = parsed.href;
          } catch {
            showToast('اكتب رابط صحيح يبدأ بـ https:// أو http://', 'error');
            return;
          }
        }
        const selectedLinkStatus = document.getElementById('link_status').value;
        const linkStatus = linkUrl ? 'available' : selectedLinkStatus;
        const pubState = readPublishState();
        const payload = {
          title: document.getElementById('title').value.trim(),
          content: document.getElementById('content').value.trim(),
          subject_id: document.getElementById('subject_id').value || null,
          importance: document.getElementById('importance').value,
          is_pinned: document.getElementById('is_pinned').checked,
          is_published: pubState.is_published,
          publish_at: pubState.publish_at,
          link_url: linkUrl || null,
          link_label: document.getElementById('link_label').value.trim() || 'دخول السيكشن أونلاين',
          link_status: linkStatus
        };
        if (!editingId) payload.created_by = currentProfile?.id || null;
        const { data: savedAnnouncement, error } = await persistAnnouncement(payload, editingId);
        if (error || !savedAnnouncement?.id) {
          console.error('Announcement save was not confirmed:', error);
          showToast(error?.message || 'تعذر حفظ الإعلان.', 'error');
          return;
        }
        showToast(editingId ? 'تم تحديث الإعلان.' : 'تم حفظ الإعلان.', 'success');
        resetForm();
        document.getElementById('form-panel').classList.add('hidden');
        await load();
      });
    }

    init().catch((error) => {
      console.error(error);
      showToast('تعذر فتح صفحة الإعلانات.', 'error');
    });
  </script>
</body>
</html>
