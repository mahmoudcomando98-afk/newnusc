<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>متجر القوالب | لوحة الإدارة</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=store-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=store-1" />
  <link rel="stylesheet" href="/assets/css/store.css?v=store-1" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>متجر القوالب</span>
      </a>
      <a href="/store.html" class="btn btn-sm btn-secondary" target="_blank">معاينة</a>
    </div>
  </header>

  <main class="page" style="padding-bottom:40px">
    <div class="container page-content" style="max-width:760px">

      <div class="card mb-3">
        <h2 class="card-title mb-2" style="font-size:1rem">بيانات التحويل للطلاب</h2>
        <form id="pay-form">
          <div class="form-group">
            <label class="form-label" for="payment_phone">رقم التحويل *</label>
            <input id="payment_phone" class="form-input" dir="ltr" maxlength="40" placeholder="01xxxxxxxxx" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="payment_name">اسم المستلم</label>
            <input id="payment_name" class="form-input" maxlength="80" placeholder="الاسم على المحفظة" />
          </div>
          <div class="form-group">
            <label class="form-label" for="payment_instructions">تعليمات الدفع</label>
            <textarea id="payment_instructions" class="form-input" rows="3" maxlength="500" placeholder="مثال: حوّل إنستاباي أو فودافون كاش ثم ارفع صورة الإيصال"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-sm">حفظ بيانات التحويل</button>
        </form>
      </div>

      <div class="card mb-3">
        <h2 class="card-title mb-2" style="font-size:1rem" id="product-form-title">إضافة قالب</h2>
        <form id="product-form">
          <input type="hidden" id="edit-id" value="" />
          <div class="form-group">
            <label class="form-label" for="title">اسم القالب *</label>
            <input id="title" class="form-input" required maxlength="120" />
          </div>
          <div class="form-group">
            <label class="form-label" for="description">الوصف</label>
            <textarea id="description" class="form-input" rows="3" maxlength="1000"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="price">السعر (جنيه) *</label>
            <input id="price" type="number" min="0" step="0.01" class="form-input" required value="0" />
          </div>
          <div class="form-group">
            <label class="form-label" for="preview_video_url">رابط فيديو معاينة (اختياري)</label>
            <input id="preview_video_url" class="form-input" dir="ltr" maxlength="500" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label class="form-label" for="preview_image">صورة معاينة</label>
            <input id="preview_image" type="file" accept="image/*" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label" for="product_file">ملف القالب (PPTX / ZIP) *</label>
            <input id="product_file" type="file" accept=".ppt,.pptx,.zip,.pdf" class="form-input" />
            <p class="text-sm text-muted mt-1">الملف مش بيظهر للطالب غير بعد موافقتك على الطلب.</p>
          </div>
          <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="is_active" checked />
              ظاهر في المتجر
            </label>
          </div>
          <div class="flex gap-1">
            <button type="submit" class="btn btn-primary" id="save-product-btn">إضافة</button>
            <button type="button" class="btn btn-secondary hidden" id="cancel-edit-btn">إلغاء</button>
          </div>
        </form>
      </div>

      <h2 class="mb-2" style="font-size:1.05rem">القوالب</h2>
      <div id="products-list" class="mb-3"></div>

      <h2 class="mb-2" style="font-size:1.05rem">طلبات الشراء</h2>
      <div class="tabs mb-2" id="order-tabs" style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn btn-sm btn-primary" data-status="pending">قيد المراجعة</button>
        <button type="button" class="btn btn-sm btn-secondary" data-status="approved">مقبولة</button>
        <button type="button" class="btn btn-sm btn-secondary" data-status="rejected">مرفوضة</button>
        <button type="button" class="btn btn-sm btn-secondary" data-status="all">الكل</button>
      </div>
      <div id="orders-list"></div>
    </div>
  </main>

  <script type="module" src="/assets/js/admin-store.js?v=store-1"></script>
</body>
</html>
