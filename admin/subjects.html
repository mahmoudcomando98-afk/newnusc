<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>إدارة المواد | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=neutral-v2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=neutral-v2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>إدارة المواد</span>
      </a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ إضافة مادة</button>
    </div>
  </header>
  <main class="page" style="padding-bottom:24px">
    <div class="container page-content">
      <div id="form-panel" class="card mb-3 hidden">
        <h3 class="card-title mb-2" id="form-title">إضافة مادة</h3>
        <form id="subject-form">
          <input type="hidden" id="edit-id" />
          <div class="form-group"><label class="form-label">اسم المادة *</label><input type="text" id="name" class="form-input" required /></div>
          <div class="form-group"><label class="form-label">رمز المادة</label><input type="text" id="code" class="form-input" dir="ltr" /></div>
          <div class="form-group"><label class="form-label">المحاضر</label><input type="text" id="instructor" class="form-input" /></div>
          <div class="form-group"><label class="form-label">الوصف</label><textarea id="description" class="form-textarea"></textarea></div>
          <div class="form-group"><label class="form-check"><input type="checkbox" id="is_active" checked /><span>منشورة</span></label></div>
          <div class="flex gap-1"><button type="submit" class="btn btn-primary">حفظ</button><button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button></div>
        </form>
      </div>
      <div id="subjects-list"><div class="skeleton-card"><div class="skeleton skeleton-title"></div></div></div>
    </div>
  </main>
  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, showEmpty, showError, showToast, withLoading, initIcons } from '../assets/js/utils.js';
    let profile = null;
    async function init() {
      const result = await protectAdminPage();
      if (!result) return;
      profile = result.profile;
      initIcons();
      document.getElementById('add-btn').addEventListener('click', () => openForm());
      document.getElementById('cancel-btn').addEventListener('click', () => closeForm());
      document.getElementById('subject-form').addEventListener('submit', saveSubject);
      await loadSubjects();
    }
    async function loadSubjects() {
      const el = document.getElementById('subjects-list');
      try {
        const { data, error } = await supabase.from('subjects').select('*');
        if (error) throw error;
        if (!data?.length) { showEmpty(el, 'لا توجد مواد. اضغط «إضافة مادة» للبدء.'); return; }
        const sorted = [...data].sort((a, b) =>
          Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
          String(a.name || '').localeCompare(String(b.name || ''), 'ar')
        );
        el.innerHTML = sorted.map(s => `
          <div class="card mb-2">
            <div class="flex justify-between items-center flex-wrap gap-1">
              <div>
                <h3 class="card-title">${escapeHtml(s.name)}</h3>
                <div class="card-meta">
                  ${s.code ? `<span class="badge badge-primary">${escapeHtml(s.code)}</span>` : ''}
                  ${s.instructor ? `<span>${escapeHtml(s.instructor)}</span>` : ''}
                  <span class="badge ${(s.is_active ?? s.is_published ?? true) ? 'badge-success' : 'badge-warning'}">${(s.is_active ?? s.is_published ?? true) ? 'منشورة' : 'مسودة'}</span>
                </div>
              </div>
              <div class="flex gap-1">
                <button type="button" class="btn btn-sm btn-secondary" data-edit='${JSON.stringify(s).replace(/'/g,"&#39;")}'>تعديل</button>
                <button type="button" class="btn btn-sm btn-danger" data-delete="${s.id}">حذف</button>
              </div>
            </div>
          </div>`).join('');
        el.querySelectorAll('[data-edit]').forEach(btn => {
          btn.addEventListener('click', () => openForm(JSON.parse(btn.getAttribute('data-edit'))));
        });
        el.querySelectorAll('[data-delete]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('حذف المادة؟')) return;
            await supabase.from('subjects').delete().eq('id', btn.dataset.delete);
            showToast('تم الحذف', 'success');
            await loadSubjects();
          });
        });
      } catch { showError(el, 'تعذر التحميل'); }
    }
    function openForm(s = null) {
      document.getElementById('form-panel').classList.remove('hidden');
      document.getElementById('form-title').textContent = s ? 'تعديل المادة' : 'إضافة مادة';
      document.getElementById('edit-id').value = s?.id || '';
      document.getElementById('name').value = s?.name || '';
      document.getElementById('code').value = s?.code || '';
      document.getElementById('instructor').value = s?.instructor || '';
      document.getElementById('description').value = s?.description || '';
      document.getElementById('is_active').checked = s ? (s.is_active ?? s.is_published ?? true) : true;
    }
    function closeForm() { document.getElementById('form-panel').classList.add('hidden'); }
    function isMissingColumn(error, column) {
      const text = `${error?.message || ''} ${error?.details || ''}`.toLowerCase();
      return text.includes(`could not find the '${column.toLowerCase()}' column`) ||
        text.includes(`column "${column.toLowerCase()}" does not exist`) ||
        text.includes(`column ${column.toLowerCase()} does not exist`) ||
        text.includes(`subjects.${column.toLowerCase()}`);
    }

    async function saveSubjectRecord(id, payload) {
      const activeValue = payload.is_published ?? payload.is_active ?? true;
      const candidate = { ...payload, is_published: activeValue };
      delete candidate.is_active;
      const triedActiveColumns = new Set();

      for (let attempt = 0; attempt < 10; attempt += 1) {
        const request = id
          ? supabase.from('subjects').update(candidate).eq('id', id).select('id, name').single()
          : supabase.from('subjects').insert(candidate).select('id, name').single();
        const result = await request;
        if (!result.error) return result;

        const activeColumn = ['is_published', 'is_active'].find((column) =>
          Object.prototype.hasOwnProperty.call(candidate, column) && isMissingColumn(result.error, column)
        );
        if (activeColumn) {
          triedActiveColumns.add(activeColumn);
          const otherColumn = activeColumn === 'is_published' ? 'is_active' : 'is_published';
          delete candidate[activeColumn];
          if (!triedActiveColumns.has(otherColumn)) candidate[otherColumn] = activeValue;
          continue;
        }

        const optionalColumns = ['code', 'instructor', 'description', 'sort_order', 'created_by'];
        const missingOptional = optionalColumns.find((column) =>
          Object.prototype.hasOwnProperty.call(candidate, column) && isMissingColumn(result.error, column)
        );
        if (missingOptional) {
          delete candidate[missingOptional];
          continue;
        }
        return result;
      }
      return { data: null, error: { message: 'تعذر حفظ المادة بعد التحقق من أعمدة قاعدة البيانات.' } };
    }

    async function saveSubject(e) {
      e.preventDefault();
      const btn = e.target.querySelector('[type="submit"]');
      const handler = withLoading(btn, async () => {
        const id = document.getElementById('edit-id').value;
        const payload = {
          name: document.getElementById('name').value.trim(),
          code: document.getElementById('code').value.trim() || null,
          instructor: document.getElementById('instructor').value.trim() || null,
          description: document.getElementById('description').value.trim() || null,
          is_published: document.getElementById('is_active').checked
        };
        const { data, error } = await saveSubjectRecord(id, payload);
        if (error || !data?.id) {
          console.error('Subject save was not confirmed:', error);
          showToast(error?.message || 'لم يتم تأكيد حفظ المادة.', 'error');
          return;
        }
        showToast('تم حفظ المادة بنجاح.', 'success');
        closeForm();
        await loadSubjects();
      });
      await handler();
    }
    init();
  </script>
</body>
</html>
