<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>سكاشن أونلاين | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=os-join-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=os-join-1" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/admin/index.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>سكاشن أونلاين</span>
      </a>
      <button type="button" class="btn btn-sm btn-primary" id="add-btn">+ إضافة</button>
    </div>
  </header>

  <main class="page" style="padding-bottom:32px">
    <div class="container page-content" style="max-width:640px">
      <p class="text-sm text-muted mb-3">أضف مواعيد السكاشن. <strong>رابط الدخول</strong> هيظهر للطالب في الرئيسية لما السكشن يبدأ — مش في صفحة الجدول.</p>

      <div id="form-panel" class="card mb-3 hidden">
        <h3 class="card-title mb-2" id="form-heading">موعد جديد</h3>
        <form id="os-form">
          <input type="hidden" id="edit_id" value="" />
          <div class="form-group">
            <label class="form-label" for="day_of_week">اليوم *</label>
            <select id="day_of_week" class="form-select" required>
              <option value="0">الأحد</option>
              <option value="1">الإثنين</option>
              <option value="2">الثلاثاء</option>
              <option value="3">الأربعاء</option>
              <option value="4">الخميس</option>
              <option value="5">الجمعة</option>
              <option value="6">السبت</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="start_time">من الساعة *</label>
            <input type="time" id="start_time" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="end_time">إلى الساعة</label>
            <input type="time" id="end_time" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label" for="course_name">المقرر *</label>
            <input type="text" id="course_name" class="form-input" required maxlength="120" placeholder="مثال: Math - 1" />
          </div>
          <div class="form-group">
            <label class="form-label" for="instructor">المعيد</label>
            <input type="text" id="instructor" class="form-input" maxlength="120" placeholder="مثال: م. آية الملاح" />
          </div>
          <div class="form-group">
            <label class="form-label" for="join_url">رابط الدخول (Zoom / Meet / Teams)</label>
            <input type="url" id="join_url" class="form-input" maxlength="500" placeholder="https://..." dir="ltr" />
            <p class="text-sm text-muted mt-1">هيظهر للطالب في الرئيسية قبل وبعد بداية السكشن بـ 15 دقيقة تقريبًا.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="sort_order">ترتيب داخل اليوم</label>
            <input type="number" id="sort_order" class="form-input" value="0" />
          </div>
          <div class="form-group">
            <label class="flex items-center gap-1">
              <input type="checkbox" id="is_compensatory" />
              <span><strong>سيكشن تعويضي</strong> — هيظهر للطلاب في قسم لوحده + إشعار على موبايلاتهم + إعلان على الرئيسية تلقائيًا</span>
            </label>
          </div>
          <div class="form-group">
            <label class="flex items-center gap-1">
              <input type="checkbox" id="is_cancelled" />
              <span><strong>ملغى</strong> — السكشن ده اتلغى (يفضل ظاهر للطلاب كـ«ملغى» + إشعار تلقائي للطلاب + إعلان على الرئيسية)</span>
            </label>
          </div>
          <div class="form-group">
            <label class="flex items-center gap-1">
              <input type="checkbox" id="is_published" checked />
              <span>ظاهر للطلاب</span>
            </label>
          </div>
          <div class="flex gap-1">
            <button type="submit" class="btn btn-primary" id="submit-btn">حفظ</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn">إلغاء</button>
          </div>
        </form>
      </div>

      <div id="list"></div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../assets/js/supabase.js';
    import { protectAdminPage } from '../assets/js/auth.js';
    import { escapeHtml, formatTime, showEmpty, showError, showToast, initIcons, WEEKDAYS_AR } from '../assets/js/utils.js';
    import { sendPushToAll } from '../assets/js/push.js';

    let cache = [];
    let editingId = null;

    function normalizeJoinUrl(raw) {
      const s = String(raw || '').trim();
      if (!s) return null;
      try {
        const u = new URL(s);
        if (!['http:', 'https:'].includes(u.protocol)) return null;
        return u.href;
      } catch {
        return null;
      }
    }

    async function init() {
      const ok = await protectAdminPage();
      if (!ok) return;
      document.documentElement.classList.remove('admin-auth-pending');
      initIcons();
      document.getElementById('add-btn').addEventListener('click', openCreate);
      document.getElementById('cancel-btn').addEventListener('click', closeForm);
      document.getElementById('os-form').addEventListener('submit', onSave);
      await load();
    }

    function openCreate() {
      editingId = null;
      document.getElementById('edit_id').value = '';
      document.getElementById('form-heading').textContent = 'موعد جديد';
      document.getElementById('os-form').reset();
      document.getElementById('is_published').checked = true;
      document.getElementById('sort_order').value = '0';
      document.getElementById('join_url').value = '';
      document.getElementById('is_compensatory').checked = false;
      document.getElementById('is_cancelled').checked = false;
      document.getElementById('form-panel').classList.remove('hidden');
    }

    function openEdit(item) {
      editingId = item.id;
      document.getElementById('edit_id').value = item.id;
      document.getElementById('form-heading').textContent = 'تعديل موعد';
      document.getElementById('day_of_week').value = String(item.day_of_week ?? 3);
      document.getElementById('start_time').value = String(item.start_time || '').slice(0, 5);
      document.getElementById('end_time').value = item.end_time ? String(item.end_time).slice(0, 5) : '';
      document.getElementById('course_name').value = item.course_name || '';
      document.getElementById('instructor').value = item.instructor || '';
      document.getElementById('join_url').value = item.join_url || '';
      document.getElementById('sort_order').value = item.sort_order ?? 0;
      document.getElementById('is_published').checked = item.is_published !== false;
      document.getElementById('is_compensatory').checked = item.is_compensatory === true;
      document.getElementById('is_cancelled').checked = item.is_cancelled === true;
      document.getElementById('form-panel').classList.remove('hidden');
      document.getElementById('form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeForm() {
      editingId = null;
      document.getElementById('form-panel').classList.add('hidden');
      document.getElementById('os-form').reset();
      document.getElementById('is_compensatory').checked = false;
      document.getElementById('is_cancelled').checked = false;
    }

    /* إشعار + إعلان تلقائي للطلاب عند تغيير ميعاد/إضافة/إلغاء أي سكشن */
    async function broadcastSectionChange(kind, item) {
      const when = `${WEEKDAYS_AR[item.day_of_week] || ''} ${formatTime(item.start_time)}`.trim();
      const textCases = {
        makeup: {
          title: `سيكشن تعويضي: ${item.course_name}`,
          body: `اتضاف سيكشن تعويضي — ${item.course_name} — ${when}${item.instructor ? ` مع ${item.instructor}` : ''}. تابع صفحة السكاشن للتفاصيل.`,
          type: 'info'
        },
        rescheduled: {
          title: `اتغير ميعاد سكشن ${item.course_name}`,
          body: `اتغير ميعاد ${item.course_name} — بقى ${when}${item.instructor ? ` مع ${item.instructor}` : ''}. تابع صفحة السكاشن للتفاصيل.`,
          type: 'warning'
        },
        cancelled: {
          title: `اتلغى سكشن ${item.course_name}`,
          body: `اتلغى ${item.course_name} — كان الميعاد ${when}${item.instructor ? ` مع ${item.instructor}` : ''}. تابع صفحة السكاشن لأي جديد.`,
          type: 'warning'
        },
        restored: {
          title: `رجع سكشن ${item.course_name}`,
          body: `رجع ${item.course_name} تاني — ميعاده ${when}${item.instructor ? ` مع ${item.instructor}` : ''}. تابع صفحة السكاشن.`,
          type: 'success'
        }
      };
      const meta = textCases[kind] || textCases.rescheduled;
      const title = meta.title;
      const body = meta.body;
      const link = '/online-sections.html';

      /* 1) يظهر في لوحة إشعارات كل الطلاب */
      const { error: notifError } = await supabase.from('notifications').insert({
        title,
        body,
        type: meta.type,
        link,
        is_global: true,
        user_id: null
      });

      /* 2) بوش على موبايلات كل الطلاب المفعّلين */
      let pushNote = '';
      try {
        const pushResult = await sendPushToAll({ title, body, url: link });
        pushNote = pushResult?.ok
          ? (pushResult.total
              ? ` + وصل لموبايلات ${pushResult.sent}/${pushResult.total} طالب`
              : ' + اتحفظت في لوحة الطلاب (مفيش أجهزة مفعّلة للتليفون)')
          : ' + التليفون فشل (راجع send-push)';
      } catch (err) {
        console.warn('[online-sections] push:', err);
        pushNote = ' + التليفون فشل';
      }

      /* 3) إعلان تلقائي على الصفحة الرئيسية */
      const { error: annError } = await supabase.from('announcements').insert({
        title,
        content: body,
        subject_id: null,
        importance: 'high',
        is_pinned: false,
        is_published: true,
        link_url: link,
        link_label: 'صفحة السكاشن',
        link_status: 'available'
      });

      if (notifError || annError) {
        console.error('[online-sections] broadcast:', notifError || annError);
        showToast(
          !notifError
            ? 'اتحفظ + اتبلّغ الطلاب — الإعلان على الرئيسية فشل (صلاحيات؟)'
            : !annError
              ? 'اتحفظ + اتعلن على الرئيسية — لوحة الإشعارات فشلت'
              : 'اتحفظ بس التبليغ فشل — راجع الصلاحيات والربط',
          'error'
        );
        return;
      }
      showToast(`تم الحفظ — اتبلّغ الطلاب${pushNote} + إعلان على الرئيسية.`, 'success');
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const { data, error } = await supabase
          .from('online_sections')
          .select('*')
          .order('day_of_week', { ascending: true })
          .order('start_time', { ascending: true });
        if (error) throw error;
        cache = data || [];
        if (!cache.length) {
          showEmpty(el, 'لسه مفيش مواعيد. اضغط «إضافة».');
          return;
        }
        el.innerHTML = cache
          .map((item) => {
            const day = WEEKDAYS_AR[item.day_of_week] || '';
            const time =
              formatTime(item.start_time) +
              (item.end_time ? ' – ' + formatTime(item.end_time) : '');
            const hasLink = !!item.join_url;
            return `
            <article class="card mb-2">
              <div class="flex justify-between items-start gap-1 flex-wrap">
                <div>
                  <h3 class="card-title" style="margin:0">${escapeHtml(item.course_name || '')}</h3>
                  <p class="text-sm text-muted mt-1">${escapeHtml(day)} · ${escapeHtml(time)}</p>
                  <p class="text-sm text-muted">${escapeHtml(item.instructor || '—')}</p>
                  <p class="text-sm mt-1">
                    <span class="badge ${item.is_published !== false ? 'badge-success' : 'badge-danger'}">
                      ${item.is_published !== false ? 'ظاهر' : 'مخفي'}
                    </span>
                    ${item.is_compensatory === true ? '<span class="badge badge-primary" style="margin-right:6px">تعويضي</span>' : ''}
                    ${item.is_cancelled === true ? '<span class="badge badge-danger" style="margin-right:6px">ملغى</span>' : ''}
                    ${hasLink ? '<span class="badge badge-primary" style="margin-right:6px">فيه رابط دخول</span>' : '<span class="badge" style="margin-right:6px">مفيش رابط</span>'}
                  </p>
                </div>
                <div class="flex gap-1">
                  <button type="button" class="btn btn-sm btn-outline" data-edit="${escapeHtml(item.id)}">تعديل</button>
                  <button type="button" class="btn btn-sm btn-danger" data-del="${escapeHtml(item.id)}">حذف</button>
                </div>
              </div>
            </article>`;
          })
          .join('');

        el.querySelectorAll('[data-edit]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const item = cache.find((x) => String(x.id) === String(btn.dataset.edit));
            if (item) openEdit(item);
          });
        });
        el.querySelectorAll('[data-del]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('تحذف الموعد ده؟')) return;
            const { error } = await supabase.from('online_sections').delete().eq('id', btn.dataset.del);
            if (error) {
              showToast(error.message || 'تعذر الحذف', 'error');
              return;
            }
            showToast('اتحذف.', 'success');
            await load();
          });
        });
      } catch (err) {
        console.error(err);
        showError(
          el,
          err.message?.includes('relation') || err.code === '42P01'
            ? 'نفّذ supabase/online_sections.sql في Supabase أولًا.'
            : 'تعذر تحميل المواعيد.'
        );
      }
    }

    async function onSave(e) {
      e.preventDefault();
      const joinRaw = document.getElementById('join_url').value.trim();
      let joinUrl = null;
      if (joinRaw) {
        joinUrl = normalizeJoinUrl(joinRaw);
        if (!joinUrl) {
          showToast('رابط الدخول مش صحيح. لازم يبدأ بـ https://', 'error');
          return;
        }
      }
      const before = editingId ? cache.find((x) => String(x.id) === String(editingId)) : null;
      const payload = {
        day_of_week: Number(document.getElementById('day_of_week').value),
        start_time: document.getElementById('start_time').value,
        end_time: document.getElementById('end_time').value || null,
        course_name: document.getElementById('course_name').value.trim(),
        instructor: document.getElementById('instructor').value.trim() || null,
        join_url: joinUrl,
        sort_order: Number(document.getElementById('sort_order').value) || 0,
        is_published: document.getElementById('is_published').checked,
        is_compensatory: document.getElementById('is_compensatory').checked,
        is_cancelled: document.getElementById('is_cancelled').checked,
        updated_at: new Date().toISOString()
      };
      if (!payload.course_name || !payload.start_time) {
        showToast('أكمل المقرر ووقت البداية.', 'error');
        return;
      }

      const rescheduled =
        !!before &&
        (Number(before.day_of_week) !== Number(payload.day_of_week) ||
          String(before.start_time || '').slice(0, 5) !== String(payload.start_time || '').slice(0, 5));
      const becameMakeup = !editingId
        ? payload.is_compensatory === true
        : !(before?.is_compensatory === true) && payload.is_compensatory === true;
      const becameCancelled = !editingId
        ? false
        : !(before?.is_cancelled === true) && payload.is_cancelled === true;
      const restored = !editingId
        ? false
        : (before?.is_cancelled === true) && !payload.is_cancelled;
      const broadcastKind = becameCancelled
        ? 'cancelled'
        : restored
          ? 'restored'
          : rescheduled
            ? 'rescheduled'
            : becameMakeup
              ? 'makeup'
              : null;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      const prevLabel = btn.textContent;
      btn.textContent = broadcastKind ? 'جاري الحفظ والتبليغ...' : 'جاري الحفظ...';
      try {
        let error;
        if (editingId) {
          ({ error } = await supabase.from('online_sections').update(payload).eq('id', editingId));
        } else {
          ({ error } = await supabase.from('online_sections').insert(payload));
        }
        if (error && /is_compensatory|is_cancelled/i.test(String(error.message || ''))) {
          const rest = { ...payload };
          if (/is_compensatory/i.test(String(error.message || ''))) delete rest.is_compensatory;
          if (/is_cancelled/i.test(String(error.message || ''))) delete rest.is_cancelled;
          ({ error } = editingId
            ? await supabase.from('online_sections').update(rest).eq('id', editingId)
            : await supabase.from('online_sections').insert(rest));
          if (!error) showToast('نفّذ ALTER TABLE على Supabase عشان تفعيل «تعويضي/ملغى» بالكامل.', 'info');
        }
        if (error) {
          if (/join_url/i.test(String(error.message || ''))) {
            showToast('نفّذ SQL: ALTER TABLE online_sections ADD COLUMN join_url TEXT;', 'error');
          } else {
            showToast(error.message || 'فشل الحفظ', 'error');
          }
          return;
        }
        if (broadcastKind) {
          const item = { ...payload, ...(editingId ? { id: editingId } : {}) };
          await broadcastSectionChange(broadcastKind, item);
        } else {
          showToast('تم الحفظ.', 'success');
        }
        closeForm();
        await load();
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    init();
  </script>
</body>
</html>
