<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>html.admin-auth-pending body{visibility:hidden!important}</style>
  <script>document.documentElement.classList.add('admin-auth-pending')</script>
  <title>الملفات | لوحة الإدارة</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=upload-progress-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=upload-progress-1" />
  <style>
    .upload-progress { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft, #f7f6f3); }
    .upload-progress-track { height: 10px; border-radius: 999px; background: rgba(0,0,0,.08); overflow: hidden; }
    .upload-progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #c45c26, #e08a4f); transition: width .15s ease-out; }
    .upload-progress-text { margin: 8px 0 0; font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
  </style>
</head>

  <div id="materials-root"></div>
  <script type="module">
    // صفحة الملفات بتعتمد على نفس الهيكل السابق عبر إعادة جلب القالب من النسخة المبنية

    import '/assets/js/admin-materials.js?v=upload-progress-1';
  </script>
