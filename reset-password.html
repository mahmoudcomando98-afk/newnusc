<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تعيين كلمة مرور جديدة | NUSC Student Hub</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">NS</div>
        <h1>كلمة مرور جديدة</h1>
        <p>أدخل كلمة المرور الجديدة لحسابك</p>
      </div>
      <form method="post" id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور الجديدة</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="6 أحرف على الأقل" required autocomplete="new-password" minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password_confirm">تأكيد كلمة المرور</label>
          <input type="password" id="password_confirm" name="password_confirm" class="form-input" placeholder="أعد إدخال كلمة المرور" required autocomplete="new-password" minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ كلمة المرور</button>
      </form>
      <div class="auth-footer">
        <a href="/login.html">العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { initResetPasswordPage } from './assets/js/auth.js';
    initResetPasswordPage();
  </script>
</body>
</html>
