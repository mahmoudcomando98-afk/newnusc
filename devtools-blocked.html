<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <title>ممنوع | COMANDO</title>
  <link rel="icon" href="/nusc.png.jpeg" type="image/jpeg" />
  <style>
    :root {
      --gold: #c69b2d;
      --gold-dark: #82621a;
      --ink: #25271f;
      --muted: #77786e;
      --line: #e9e4d6;
      --surface: #fff;
      --bg: #f7f6f1;
    }
    html[data-theme="dark"] {
      --ink: #f0ebe6;
      --muted: #a89f96;
      --line: #33302c;
      --surface: #1c1b19;
      --bg: #141312;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Cairo", Tahoma, Arial, sans-serif;
    }
    .blocked-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(45, 42, 29, 0.12);
      text-align: center;
    }
    .blocked-top {
      background: linear-gradient(135deg, #25271f 0%, #3c3e33 100%);
      color: #fff7d8;
      padding: 22px 20px 18px;
    }
    .blocked-brand {
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f4d779;
    }
    .blocked-icon {
      width: 66px;
      height: 66px;
      margin: 14px auto 8px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(244, 215, 121, 0.14);
      border: 1px solid rgba(244, 215, 121, 0.35);
      color: #f4d779;
    }
    .blocked-icon svg { width: 32px; height: 32px; }
    .blocked-title {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.7;
      margin: 0;
      color: #fff9e5;
    }
    .blocked-body { padding: 20px 22px 24px; }
    .blocked-text {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.9;
      margin: 0 0 8px;
    }
    .blocked-sub {
      font-size: 0.78rem;
      line-height: 1.9;
      color: var(--muted);
      margin: 0;
    }
    .blocked-actions { margin-top: 18px; display: flex; gap: 8px; }
    .blocked-actions a {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--gold);
      color: #fff;
      font-weight: 800;
      font-size: 0.86rem;
      text-decoration: none;
    }
    .blocked-actions a:hover { background: var(--gold-dark); }
    .blocked-note {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .blocked-count { color: var(--gold-dark); font-weight: 800; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <section class="blocked-card" role="alert" aria-labelledby="blocked-title">
    <div class="blocked-top">
      <div class="blocked-brand">COMANDO</div>
      <div class="blocked-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <line x1="9" y1="9" x2="15" y2="15" />
          <line x1="15" y1="9" x2="9" y2="15" />
        </svg>
      </div>
      <h1 class="blocked-title" id="blocked-title">ممنوع استخدام أدوات المطوّر</h1>
    </div>
    <div class="blocked-body">
      <p class="blocked-text">المنصة محمية — مش مسموح بفتح أدوات المطوّر أو فحص كود الصفحات.</p>
      <p class="blocked-sub">لو فتحتها تاني، هتتم إعادتك للرئيسية تلقائيًا. رجّع للصفحة اللي كنت عليها وكمّل مذاكرتك.</p>
      <div class="blocked-actions">
        <a href="/home.html">العودة للرئيسية</a>
      </div>
      <p class="blocked-note">هترجع تلقائيًا خلال <span class="blocked-count" id="blocked-count">10</span> ثوانٍ.</p>
    </div>
  </section>

  <script>
    (function () {
      var el = document.getElementById('blocked-count');
      var left = 10;
      var timer = setInterval(function () {
        left -= 1;
        if (el) el.textContent = String(Math.max(left, 0));
        if (left <= 0) {
          clearInterval(timer);
          location.replace('/home.html');
        }
      }, 1000);
    })();
  </script>
</body>
</html>
