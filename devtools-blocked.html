<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>تم حظر أدوات المطوّر | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=devtools-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=devtools-1" />
  <style>
    body { background: #f7f5f2; }
    .block-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 48px 16px 40px;
    }
    .block-card {
      background: #fff;
      border: 1px solid #e8e4df;
      border-radius: 14px;
      padding: 28px 22px;
      text-align: center;
    }
    .block-card h1 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      color: #8a3a3a;
    }
    .block-card p {
      margin: 0 0 12px;
      color: #5c564f;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .block-warn {
      background: #faf2f2;
      border: 1px solid #e8d5d5;
      border-radius: 10px;
      padding: 12px;
      color: #8a3a3a;
      font-size: 0.88rem;
      margin: 16px 0;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="block-wrap">
    <div class="block-card">
      <h1>تم حظر أدوات المطوّر</h1>
      <p>تم رصد محاولة فتح أدوات المطوّر (F12 أو اختصارات مشابهة) داخل المنصة.</p>
      <div class="block-warn" id="warn-box">
        ارجع للصفحة الرئيسية فورًا. لو حاولت تاني، هيتم إبلاغ إدارة المنصة، وممكن يتم حظر حسابك.
      </div>
      <a class="btn btn-primary" href="/home.html" id="back-btn" style="width:100%">ارجع للصفحة الرئيسية</a>
      <p class="text-sm text-muted" style="margin-top:14px">لو فتحت الأدوات بالغلط، اقفالها وارجع عادي.</p>
    </div>
  </div>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const n = Number(params.get('n') || 1);
    const warn = document.getElementById('warn-box');
    if (n >= 2 && warn) {
      warn.textContent =
        'دي مش أول مرة. تم إرسال تنبيه لإدارة المنصة بالحساب والمحاولة. لو استمرت المحاولات ممكن يتم حظر الحساب.';
    }
    // Block page itself still reports if they hammer F12 again
    document.addEventListener(
      'keydown',
      (e) => {
        if (e.key === 'F12' || e.code === 'F12') {
          e.preventDefault();
        }
      },
      true
    );
  </script>
</body>
</html>
