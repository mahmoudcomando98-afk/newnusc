<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f4" />
  <meta name="description" content="منصة NUSC الأكاديمية لطلاب كلية الحاسبات والمعلومات" />
  <title>NUSC</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f6f4; color: #292d32; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100dvh; background: #f6f6f4; }
    .fallback { display: none; min-height: 100dvh; padding: 24px; align-items: center; justify-content: center; }
    .fallback.show { display: flex; }
    .fallback-content { width: min(100%, 420px); padding: 24px; background: #fff; border: 1px solid #e2e4e5; border-radius: 10px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.2rem; }
    p { margin: 0; color: #747a80; line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 9px 15px; border: 1px solid #d8dcdf; border-radius: 7px; color: #454d55; text-decoration: none; font-weight: 700; }
    a.primary { background: #454d55; color: #fff; border-color: #454d55; }
    :focus-visible { outline: 2px solid #8a939b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="fallback" id="fallback" role="status" aria-live="polite">
    <div class="fallback-content">
      <h1>تعذر فتح المنصة تلقائيًا</h1>
      <p id="fallback-message">تقدر تدخل يدويًا من أحد الاختيارات التالية.</p>
      <div class="actions">
        <a class="primary" href="/login.html">تسجيل الدخول</a>
        <a href="/register.html">إنشاء حساب</a>
      </div>
    </div>
  </main>

  <script type="module">
    const fallback = document.getElementById('fallback');
    const fallbackMessage = document.getElementById('fallback-message');
    let routed = false;

    const showFallback = (message) => {
      if (routed) return;
      fallbackMessage.textContent = message || 'تقدر تدخل يدويًا من أحد الاختيارات التالية.';
      fallback.classList.add('show');
    };

    const timeout = window.setTimeout(() => {
      showFallback('الاتصال اتأخر شوية. تقدر تكمل يدويًا من هنا.');
    }, 7000);

    try {
      const { getSession, isSupabaseConfigured } = await import('./assets/js/supabase.js');
      if (!isSupabaseConfigured()) {
        window.clearTimeout(timeout);
        showFallback('إعدادات الاتصال غير مكتملة. تقدر تدخل يدويًا أو تتواصل مع الدعم.');
      } else {
        const session = await getSession();
        if (!routed) {
          routed = true;
          window.clearTimeout(timeout);
          window.location.replace(session ? '/home.html' : '/login.html');
        }
      }
    } catch (error) {
      window.clearTimeout(timeout);
      console.error('[NUSC] Startup routing failed:', error);
      showFallback('حصلت مشكلة أثناء فتح المنصة. جرّب تسجيل الدخول يدويًا.');
    }
  </script>
</body>
</html>
