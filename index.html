<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="منصة NUSC — ملفات المواد، مواعيد الكويزات، وإعلانات الدكاترة لطلاب كلية الحاسبات والمعلومات." />
  <meta name="robots" content="noindex" />
  <title>NUSC</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #faf9f7; }
    body { min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #2c2a28; }
    .boot { text-align: center; padding: 24px; color: #7a736c; font-size: 0.95rem; }
  </style>
</head>
<body>
  <p class="boot" id="boot" aria-live="polite">جاري التحويل…</p>

  <script type="module">
    /**
     * Entry router: logged-in → home, otherwise → login.
     * Never show an error screen to guests — just go to login.
     */
    const LOGIN = '/login.html';
    const HOME = '/home.html';

    function go(path) {
      window.location.replace(path);
    }

    // Hard ceiling: if anything stalls, guests land on login (not an error page).
    const hardLimit = window.setTimeout(() => go(LOGIN), 4000);

    async function route() {
      try {
        const mod = await import('./assets/js/supabase.js');
        const session = await Promise.race([
          mod.getSession(),
          new Promise((resolve) => setTimeout(() => resolve(null), 2500))
        ]);
        window.clearTimeout(hardLimit);
        go(session ? HOME : LOGIN);
      } catch {
        window.clearTimeout(hardLimit);
        go(LOGIN);
      }
    }

    route();
  </script>
</body>
</html>
