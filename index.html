<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="منصة COMANDO التعليمية — ملفات المواد، مواعيد الكويزات، والإعلانات." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="COMANDO — منصة COMANDO التعليمية" />
  <meta property="og:description" content="ملفات المواد، مواعيد الكويزات، والإعلانات في مكان واحد." />
  <meta property="og:image" content="/nusc.png.jpeg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/nusc.png.jpeg" />
  <link rel="icon" href="/nusc.png.jpeg" type="image/jpeg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>COMANDO</title>
  <link rel="stylesheet" href="/comando-cairo.css?v=3" />
  <style>
    :root {
      --bg: #faf9f7;
      --ink: #2c2a28;
      --primary: #dd6b20;
    }
    html[data-theme='dark'] {
      --bg: #141312;
      --ink: #f3eee8;
      --primary: #f0903c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Cairo", Tahoma, Arial, sans-serif;
      overflow: hidden;
    }
    body { display: grid; place-items: center; position: relative; }
    .stage { position: relative; z-index: 2; text-align: center; padding: 24px; }
    .word {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.06em;
      font-weight: 800;
      font-size: clamp(2.4rem, 12vw, 4.6rem);
      letter-spacing: 0.04em;
      line-height: 1;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .letter {
      display: inline-block;
      color: var(--primary);
      opacity: 0;
      transform: translate3d(var(--dx, 0), var(--dy, 0), 0) scale(0.35) rotate(var(--rot, 0deg));
      filter: blur(6px);
      will-change: transform, opacity, filter;
    }
    .letter.in {
      animation: letter-in 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--delay, 0ms);
    }
    @keyframes letter-in {
      0% {
        opacity: 0;
        transform: translate3d(var(--dx, 0), var(--dy, 0), 0) scale(0.35) rotate(var(--rot, 0deg));
        filter: blur(6px);
      }
      70% { opacity: 1; filter: blur(0); }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        filter: blur(0);
      }
    }
    .tagline {
      margin-top: 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: color-mix(in srgb, var(--ink) 55%, transparent);
      opacity: 0;
      transform: translateY(8px);
    }
    .tagline.show { animation: fade-up 0.5s ease forwards 0.15s; }
    @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }
    .glow {
      position: absolute;
      width: min(70vw, 420px);
      height: min(70vw, 420px);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--primary) 22%, transparent) 0%, transparent 68%);
      filter: blur(8px);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.7);
    }
    .glow.show { animation: glow-in 1.1s ease forwards; }
    @keyframes glow-in { to { opacity: 1; transform: scale(1); } }
    .skip {
      position: fixed;
      inset-inline-end: 16px;
      inset-block-end: 18px;
      z-index: 5;
      border: 0;
      background: transparent;
      color: color-mix(in srgb, var(--ink) 45%, transparent);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 10px;
      cursor: pointer;
    }
    .skip:hover { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      .letter, .letter.in, .tagline, .tagline.show, .glow, .glow.show {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('comando-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <main class="stage" aria-label="ترحيب COMANDO">
    <div class="word" id="word" aria-label="COMANDO"></div>
    <p class="tagline" id="tagline">منصة COMANDO التعليمية</p>
  </main>
  <button type="button" class="skip" id="skip">تخطي</button>

  <script type="module">
    const LOGIN = '/login.html';
    const HOME = '/home.html';
    const SPLASH_KEY = 'comando_splash_ok';

    const LETTERS = 'COMANDO'.split('');
    const offsets = [
      { dx: '-42px', dy: '28px', rot: '-18deg' },
      { dx: '36px', dy: '-34px', rot: '14deg' },
      { dx: '-28px', dy: '-40px', rot: '10deg' },
      { dx: '48px', dy: '22px', rot: '-12deg' },
      { dx: '-18px', dy: '36px', rot: '16deg' },
      { dx: '30px', dy: '-22px', rot: '-8deg' },
      { dx: '-34px', dy: '18px', rot: '11deg' }
    ];

    const word = document.getElementById('word');
    const tagline = document.getElementById('tagline');
    const glow = document.getElementById('glow');
    const skip = document.getElementById('skip');
    let finished = false;
    let target = LOGIN;

    LETTERS.forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = ch;
      span.style.setProperty('--dx', offsets[i].dx);
      span.style.setProperty('--dy', offsets[i].dy);
      span.style.setProperty('--rot', offsets[i].rot);
      span.style.setProperty('--delay', i * 90 + 'ms');
      word.appendChild(span);
    });

    requestAnimationFrame(() => {
      glow.classList.add('show');
      Array.from(word.children).forEach((el) => el.classList.add('in'));
      window.setTimeout(() => tagline.classList.add('show'), 520);
    });

    function markSplashDone() {
      try { sessionStorage.setItem(SPLASH_KEY, '1'); } catch (e) {}
    }

    function go() {
      if (finished) return;
      finished = true;
      markSplashDone();
      window.location.replace(target);
    }

    (async () => {
      try {
        const mod = await import('./assets/js/supabase.js');
        const session = await Promise.race([
          mod.getSession(),
          new Promise((resolve) => setTimeout(() => resolve(null), 2200))
        ]);
        target = session ? HOME : LOGIN;
      } catch {
        target = LOGIN;
      }
    })();

    let reduce = false;
    try {
      reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}

    const total = reduce ? 350 : 2800;
    const timer = window.setTimeout(go, total);
    skip.addEventListener('click', () => {
      window.clearTimeout(timer);
      go();
    });
  </script>
</body>
</html>
