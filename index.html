<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="منصة COMANDO التعليمية — ملفات المواد، مواعيد الكويزات، والإعلانات." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="COMANDO — منصة COMANDO التعليمية" />
  <meta property="og:description" content="ملفات المواد، مواعيد الكويزات، والإعلانات في مكان واحد." />
  <meta property="og:image" content="/nusc.png.jpeg" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/nusc.png.jpeg" type="image/jpeg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/nusc.png.jpeg" />
  <title>COMANDO</title>
  <link rel="stylesheet" href="/comando-cairo.css?v=3" />
  <link rel="prefetch" href="/home.html" as="document" />
  <link rel="prefetch" href="/login.html" as="document" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #2c2a28;
      --primary: #dd6b20;
      --muted: #8a837a;
    }
    html[data-theme='dark'] {
      --bg: #121110;
      --ink: #f3eee8;
      --primary: #f0903c;
      --muted: #a39b92;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Cairo", Tahoma, Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      transition: opacity 0.35s ease;
    }
    body.is-leaving { opacity: 0; pointer-events: none; }
    .stage { text-align: center; padding: 28px 20px; max-width: 92vw; }
    .brand {
      direction: ltr;
      unicode-bidi: isolate;
      font-weight: 800;
      font-size: clamp(2.6rem, 11vw, 4.2rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--primary);
      display: inline-flex;
      gap: 0.05em;
    }
    .brand span {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    .line {
      width: 48px;
      height: 2px;
      margin: 18px auto 14px;
      background: color-mix(in srgb, var(--primary) 55%, transparent);
      border-radius: 2px;
      opacity: 0;
      transform: scaleX(0.4);
      animation: line-in 0.45s ease forwards 0.55s;
    }
    @keyframes line-in {
      to { opacity: 1; transform: scaleX(1); }
    }
    .tagline {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--muted);
      opacity: 0;
      animation: fade 0.45s ease forwards 0.7s;
    }
    .status {
      margin-top: 16px;
      font-size: 0.8rem;
      color: color-mix(in srgb, var(--muted) 85%, transparent);
      opacity: 0;
      min-height: 1.2em;
    }
    .status.show { animation: fade 0.35s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .skip {
      position: fixed;
      inset-inline-end: max(12px, env(safe-area-inset-right));
      inset-block-end: max(14px, env(safe-area-inset-bottom));
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      .brand span, .line, .tagline, .status { animation: none !important; opacity: 1 !important; transform: none !important; }
      body { transition: none; }
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('comando-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="stage" aria-label="ترحيب COMANDO">
    <div class="brand" id="word" aria-label="COMANDO"></div>
    <div class="line" aria-hidden="true"></div>
    <p class="tagline">منصة COMANDO التعليمية</p>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
  <button type="button" class="skip" id="skip">تخطي</button>

  <script type="module">
    const LOGIN = '/login.html';
    const HOME = '/home.html';
    const SPLASH_KEY = 'comando_splash_ok';
    const LETTERS = 'COMANDO'.split('');
    const word = document.getElementById('word');
    const status = document.getElementById('status');
    const skip = document.getElementById('skip');
    let finished = false;
    let target = LOGIN;

    LETTERS.forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.setProperty('--d', 80 + i * 70 + 'ms');
      word.appendChild(span);
    });

    function markDone() {
      try { sessionStorage.setItem(SPLASH_KEY, '1'); } catch (e) {}
    }

    function go() {
      if (finished) return;
      finished = true;
      markDone();
      if (status) {
        status.textContent = target === HOME ? 'مرحبًا بيك' : 'جاري فتح الدخول…';
        status.classList.add('show');
      }
      document.body.classList.add('is-leaving');
      window.setTimeout(() => location.replace(target), reduceMotion ? 0 : 260);
    }

    let reduceMotion = false;
    try {
      reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}

    (async () => {
      try {
        const mod = await import('./assets/js/supabase.js');
        const session = await Promise.race([
          mod.getSession(),
          new Promise((resolve) => setTimeout(() => resolve(null), 2000))
        ]);
        target = session ? HOME : LOGIN;
      } catch {
        target = LOGIN;
      }
      try {
        const l = document.createElement('link');
        l.rel = 'prefetch';
        l.as = 'document';
        l.href = target;
        document.head.appendChild(l);
      } catch (e) {}
    })();

    const total = reduceMotion ? 280 : 1800;
    const timer = window.setTimeout(go, total);
    skip.addEventListener('click', () => {
      window.clearTimeout(timer);
      go();
    });
  </script>
</body>
</html>
