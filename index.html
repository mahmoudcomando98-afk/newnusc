<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="منصة COMANDO التعليمية — ملفات المواد، مواعيد الكويزات، والإعلانات." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="COMANDO — منصة COMANDO التعليمية" />
  <meta property="og:description" content="ملفات المواد، مواعيد الكويزات، والإعلانات في مكان واحد." />
  <meta property="og:image" content="/nusc.png.jpeg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/nusc.png.jpeg" />
  <link rel="icon" href="/nusc.png.jpeg" type="image/jpeg" />
  <title>COMANDO</title>
  <link rel="stylesheet" href="/assets/css/cairo-font.css" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #faf9f7; }
    body { min-height: 100dvh; display: grid; place-items: center; font-family: Cairo, system-ui, sans-serif; color: #2c2a28; }
    .boot { text-align: center; padding: 24px; color: #7a736c; font-size: 0.95rem; }
  </style>
</head>
<body>
  <p class="boot" id="boot" aria-live="polite">جاري التحويل…</p>

  <script type="module">
    const LOGIN = '/login.html';
    const HOME = '/home.html';

    function go(path) {
      window.location.replace(path);
    }

    const hardLimit = window.setTimeout(() => go(LOGIN), 4000);

    async function route() {
      try {
        const mod = await import('./assets/js/supabase.js');
        const session = await Promise.race([
          mod.getSession(),
          new Promise((resolve) => setTimeout(() => resolve(null), 2500))
        ]);
        window.clearTimeout(hardLimit);
        go(session ? HOME : LOGIN);
      } catch {
        window.clearTimeout(hardLimit);
        go(LOGIN);
      }
    }

    route();
  </script>
</body>
</html>
