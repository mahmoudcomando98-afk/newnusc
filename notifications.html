<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>الإشعارات | MUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/home.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الإشعارات</span>
      </a>
      <button type="button" class="btn btn-sm btn-secondary" id="mark-all">تعيين الكل كمقروء</button>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div id="notif-list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" class="active"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { protectPage } from './assets/js/auth.js';
    import { escapeHtml, timeAgo, showEmpty, showError, showToast, initIcons } from './assets/js/utils.js';

    let profile = null;
    let announcements = [];

    function readKey() {
      return 'nusc_read_announcements_' + (profile?.id || 'guest');
    }
    function getReadIds() {
      try {
        const value = JSON.parse(localStorage.getItem(readKey()) || '[]');
        return new Set(Array.isArray(value) ? value : []);
      } catch {
        return new Set();
      }
    }
    function saveReadIds(ids) {
      try { localStorage.setItem(readKey(), JSON.stringify([...ids])); } catch {}
    }

    async function init() {
      const result = await protectPage();
      if (!result) return;
      profile = result.profile;
      initIcons();
      document.getElementById('mark-all')?.addEventListener('click', markAll);
      await load();
    }

    async function load() {
      const el = document.getElementById('notif-list');
      try {
        // Announcements are the existing, published source of student-facing updates.
        // This avoids depending on notification tables/RPCs that may not exist in this project.
        const { data, error } = await supabase
          .from('announcements')
          .select('id, title, content, priority, is_pinned, created_at')
          .eq('is_published', true)
          .order('is_pinned', { ascending: false })
          .order('created_at', { ascending: false })
          .limit(50);

        if (error) throw error;
        announcements = data || [];
        if (!announcements.length) {
          showEmpty(el, 'لا توجد إشعارات أو إعلانات جديدة حالياً');
          return;
        }

        render();
      } catch (err) {
        console.error('[NUSC] notifications load failed:', err);
        showError(el, 'تعذر تحميل الإشعارات. حاول تحديث الصفحة، وإذا استمرت المشكلة راجع اتصال قاعدة البيانات والصلاحيات.');
      }
    }

    function render() {
      const el = document.getElementById('notif-list');
      const readIds = getReadIds();
      el.innerHTML = announcements.map(n => {
        const isRead = readIds.has(String(n.id));
        const priority = n.priority === 'urgent' || n.priority === 'high'
          ? '<span class="badge badge-warning">مهم</span>'
          : '';
        return `
          <article class="card mb-2" data-id="${escapeHtml(String(n.id))}" style="${isRead ? 'opacity:.72' : ''}">
            <div class="flex items-center justify-between gap-1 mb-1">
              <h3 class="card-title">${escapeHtml(n.title || 'إعلان جديد')}</h3>
              <div class="flex items-center gap-1">${priority}${isRead ? '<span class="badge">مقروء</span>' : '<span class="badge badge-primary">جديد</span>'}</div>
            </div>
            ${n.content ? `<p class="text-sm">${escapeHtml(n.content)}</p>` : ''}
            <div class="card-meta"><span>${timeAgo(n.created_at)}</span>${n.is_pinned ? '<span class="badge badge-info">مثبّت</span>' : ''}</div>
            <a href="/announcements.html" class="btn btn-sm btn-outline mt-1">عرض الإعلانات</a>
          </article>`;
      }).join('');

      el.querySelectorAll('[data-id]').forEach(card => {
        card.addEventListener('click', event => {
          if (event.target.closest('a')) return;
          const ids = getReadIds();
          ids.add(String(card.dataset.id));
          saveReadIds(ids);
          const title = card.querySelector('.card-title');
          if (title) title.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          render();
        });
      });
    }

    function markAll() {
      saveReadIds(new Set([...getReadIds(), ...announcements.map(n => String(n.id))]));
      render();
      showToast('تم تعيين الكل كمقروء', 'success');
    }

    init();
  </script>
</body>
</html>
