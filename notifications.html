<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <title>الإشعارات | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=comando-2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/home.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>الإشعارات</span>
      </a>
      <button type="button" class="btn btn-sm btn-secondary" id="mark-all">تعيين الكل كمقروء</button>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div id="notif-list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html" data-nav="home"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html" data-nav="subjects"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html" data-nav="quizzes"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html" data-nav="schedule"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" data-nav="profile"><span data-icon="user"></span>حسابي</a>
  </nav>

  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { protectPage } from './assets/js/auth.js';
    import { escapeHtml, timeAgo, showEmpty, showError, showToast, initIcons } from './assets/js/utils.js';

    let profile = null;
    let items = [];

    function readKey() {
      return 'comando_read_notifs_' + (profile?.id || 'guest');
    }
    function getReadIds() {
      try {
        const value = JSON.parse(localStorage.getItem(readKey()) || '[]');
        return new Set(Array.isArray(value) ? value.map(String) : []);
      } catch {
        return new Set();
      }
    }
    function saveReadIds(ids) {
      try {
        localStorage.setItem(readKey(), JSON.stringify([...ids]));
      } catch {}
    }

    function safeLink(raw) {
      if (!raw || typeof raw !== 'string') return '/notifications.html';
      const v = raw.trim();
      if (v.startsWith('/')) return v;
      try {
        const u = new URL(v);
        if (['http:', 'https:'].includes(u.protocol)) return u.href;
      } catch {}
      return '/notifications.html';
    }

    function render() {
      const el = document.getElementById('notif-list');
      if (!items.length) {
        showEmpty(el, 'مفيش إشعارات حالياً');
        return;
      }
      const read = getReadIds();
      el.innerHTML = items
        .map((item) => {
          const id = String(item.id);
          const isRead = read.has(id);
          const href = safeLink(item.link);
          return `
          <article class="card notification-card mb-2" data-id="${escapeHtml(id)}" style="${isRead ? 'opacity:.72' : ''}">
            <div class="flex justify-between items-center gap-1">
              <h3 class="card-title" style="margin:0">${escapeHtml(item.title || 'إشعار')}</h3>
              ${!isRead ? '<span class="badge">جديد</span>' : ''}
            </div>
            ${item.body ? `<p class="text-sm text-muted mt-1">${escapeHtml(item.body)}</p>` : ''}
            <p class="text-sm text-muted mt-1">${escapeHtml(timeAgo(item.created_at))}${item.source === 'announcement' ? ' · إعلان' : ''}</p>
            <div class="mt-2">
              <a class="btn btn-sm btn-secondary" href="${escapeHtml(href)}">فتح</a>
            </div>
          </article>`;
        })
        .join('');

      el.querySelectorAll('[data-id]').forEach((card) => {
        card.addEventListener('click', (ev) => {
          if (ev.target.closest('a')) return;
          const ids = getReadIds();
          ids.add(card.dataset.id);
          saveReadIds(ids);
          card.style.opacity = '0.72';
          const badge = card.querySelector('.badge');
          if (badge) badge.remove();
        });
      });
      initIcons();
    }

    async function load() {
      const el = document.getElementById('notif-list');
      try {
        const uid = profile?.id;
        let rows = [];

        let notifQuery = supabase
          .from('notifications')
          .select('id, title, body, type, link, is_global, user_id, created_at')
          .order('created_at', { ascending: false })
          .limit(50);

        const { data: notifs, error: notifErr } = await notifQuery;

        if (!notifErr && notifs) {
          rows = notifs
            .filter((n) => n.is_global === true || (uid && n.user_id === uid))
            .map((n) => ({ ...n, source: 'notification' }));
        } else if (notifErr) {
          console.warn('notifications table:', notifErr.message);
        }

        try {
          const { data: anns } = await supabase
            .from('announcements')
            .select('id, title, content, created_at, is_published')
            .eq('is_published', true)
            .order('created_at', { ascending: false })
            .limit(20);
          for (const a of anns || []) {
            rows.push({
              id: 'ann-' + a.id,
              title: a.title,
              body: a.content,
              link: '/announcements.html',
              created_at: a.created_at,
              source: 'announcement'
            });
          }
        } catch {}

        rows.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        items = rows;

        if (!items.length) {
          showEmpty(el, 'مفيش إشعارات حالياً');
          return;
        }
        render();
      } catch (err) {
        console.error(err);
        showError(el, 'تعذر تحميل الإشعارات. حاول مرة أخرى.');
      }
    }

    async function init() {
      const result = await protectPage();
      if (!result) return;
      profile = result.profile || null;
      initIcons();

      document.getElementById('mark-all')?.addEventListener('click', () => {
        saveReadIds(items.map((i) => String(i.id)));
        showToast('تم تعليم الكل كمقروء', 'success');
        render();
      });

      await load();
    }

    init();
  </script>
</body>
</html>
