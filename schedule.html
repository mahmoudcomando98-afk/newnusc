<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="الجدول الدراسي على منصة COMANDO التعليمية" />
  <title>الجدول | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=schedule-polish-3" />
  <style>
    .schedule-page .page-content { max-width: 1040px; }
    .schedule-page .section-header { margin: 8px 0 18px !important; padding: 18px 20px; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
    .schedule-page .section-header h1 { font-size: 1.35rem !important; }
    .schedule-page .section-header h1::after { content: "رتّب محاضراتك ومواعيدك في مكان واحد"; display: block; margin-top: 5px; color: var(--text-muted); font-size: .84rem; font-weight: 400; }
    .schedule-page #view-tabs { display: inline-flex; padding: 4px; gap: 4px !important; margin-bottom: 16px !important; border: 1px solid var(--border); border-radius: 9px; background: #f5f0eb; }
    .schedule-page #view-tabs .tab { min-width: 100px; border: 0 !important; background: transparent !important; border-radius: 6px !important; padding: 8px 16px !important; }
    .schedule-page #view-tabs .tab.active { background: #fff !important; color: var(--primary-dark) !important; border: 1px solid #ebe0d7 !important; }
    .schedule-page .schedule-card, .schedule-page #schedule-content > .card { padding: 14px 16px !important; margin-bottom: 10px !important; transition: border-color .15s ease; }
    .schedule-page .schedule-card:hover, .schedule-page #schedule-content > .card:hover { border-color: #d9b8a3 !important; }
    .schedule-page .schedule-card .list-item, .schedule-page #schedule-content > .card .list-item { gap: 12px; }
    .schedule-page .schedule-card .list-item-icon, .schedule-page #schedule-content > .card .list-item-icon { width: 42px; height: 42px; min-width: 42px; display: grid; place-items: center; color: var(--primary-dark); background: #f8efe8 !important; border: 1px solid #eee0d5 !important; }
    .schedule-page .list-item-title { color: var(--text); font-size: .98rem; font-weight: 700; line-height: 1.5; margin-bottom: 5px; }
    .schedule-page .list-item-desc { color: var(--text-muted); font-size: .82rem; line-height: 1.9; }
    .schedule-page .badge { display: inline-flex; align-items: center; padding: 2px 9px; margin-inline-end: 3px; font-size: .72rem; }
    .schedule-page #schedule-content > .card > .card-title { padding-bottom: 10px; margin-bottom: 4px !important; border-bottom: 1px solid var(--border); color: var(--primary-dark); }
    .schedule-page .skeleton-card { padding: 18px !important; }
    @media (max-width: 640px) {
      .schedule-page .section-header { padding: 15px 14px; margin-bottom: 14px !important; }
      .schedule-page .section-header h1 { font-size: 1.18rem !important; }
      .schedule-page .section-header h1::after { font-size: .78rem; }
      .schedule-page #view-tabs { display: flex; width: 100%; }
      .schedule-page #view-tabs .tab { flex: 1; min-width: 0; }
      .schedule-page .schedule-card, .schedule-page #schedule-content > .card { padding: 12px !important; }
      .schedule-page .schedule-card .list-item-icon, .schedule-page #schedule-content > .card .list-item-icon { width: 36px; height: 36px; min-width: 36px; }
    }
  </style>
</head>
<body class="schedule-page">
  <header class="app-header">
    <div class="container">
      <a href="/home.html" class="logo"><span class="logo-icon">C</span><span>COMANDO</span></a>
      <nav class="desktop-nav">
        <a href="/home.html" data-nav="home">الرئيسية</a>
        <a href="/subjects.html" data-nav="subjects">المواد</a>
        <a href="/quizzes.html" data-nav="quizzes">الكويزات</a>
        <a href="/schedule.html" data-nav="schedule" class="active">الجدول</a>
        <a href="/announcements.html" data-nav="announcements">الإعلانات</a>
      </nav>
      <div class="header-actions">
        <a href="/notifications.html" class="header-btn" title="الإشعارات"><span data-icon="bell"></span></a>
        <a href="/profile.html" class="header-btn" title="حسابي"><span data-icon="user"></span></a>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div class="section-header"><h1>الجدول الدراسي</h1></div>
      <div class="tabs" id="view-tabs" role="tablist">
        <button type="button" class="tab active" data-view="list" role="tab">قائمة</button>
        <button type="button" class="tab" data-view="week" role="tab">حسب اليوم</button>
      </div>
      <div id="schedule-root">
        <div id="schedule-content" aria-live="polite">
          <div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div></div>
        </div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html" data-nav="home"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html" data-nav="subjects"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html" data-nav="quizzes"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html" data-nav="schedule" class="active"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" data-nav="profile"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module" src="/assets/js/schedule.js"></script>
</body>
</html>
