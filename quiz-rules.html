<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>قواعد الكويزات | NUSC Student Hub</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=neutral-v2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=neutral-v2" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/quizzes.html" class="logo">
        <span data-icon="chevronLeft" style="display:flex;width:24px;height:24px"></span>
        <span>قواعد الكويزات</span>
      </a>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <div id="rules-list">
        <div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html" class="active"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { protectPage } from './assets/js/auth.js';
    import { escapeHtml, showEmpty, showError, initIcons } from './assets/js/utils.js';

    function friendlyError(error) {
      const message = String(error?.message || '');
      const code = String(error?.code || '');
      if (code === '42P01' || code === 'PGRST205' || /relation .*quiz_rules.* does not exist|could not find the table .*quiz_rules/i.test(message)) {
        return 'جدول قواعد الكويزات غير موجود في قاعدة البيانات. شغّل ملف supabase/fix_quiz_rules.sql في SQL Editor داخل Supabase.';
      }
      if (code === '42501' || /row-level security|permission denied|not allowed/i.test(message)) {
        return 'صلاحيات قراءة قواعد الكويزات غير مفعّلة. راجع سياسات RLS لجدول quiz_rules في Supabase.';
      }
      return 'تعذر تحميل القواعد حاليًا. راجع اتصال قاعدة البيانات وصلاحيات قراءة جدول quiz_rules.';
    }

    async function init() {
      const el = document.getElementById('rules-list');
      try {
        const result = await protectPage();
        if (!result) return;
        initIcons();

        // Avoid embedding subjects(name) in the query: it fails when the live
        // database's foreign-key relationship cache is missing or stale.
        const { data, error } = await supabase
          .from('quiz_rules')
          .select('id, title, content, is_general, subject_id, sort_order')
          .eq('is_published', true)
          .order('is_general', { ascending: false })
          .order('sort_order', { ascending: true });

        if (error) throw error;
        if (!data?.length) {
          showEmpty(el, 'لا توجد قواعد منشورة حالياً');
          return;
        }

        const subjectIds = [...new Set(data.map(rule => rule.subject_id).filter(Boolean))];
        const subjectNames = new Map();
        if (subjectIds.length) {
          const { data: subjects, error: subjectError } = await supabase
            .from('subjects')
            .select('id, name')
            .in('id', subjectIds);
          if (subjectError) {
            // Rules themselves remain useful even if subject labels cannot load.
            console.warn('Could not load quiz rule subject labels:', subjectError.message);
          } else {
            (subjects || []).forEach(subject => subjectNames.set(subject.id, subject.name));
          }
        }

        el.innerHTML = data.map(rule => {
          const title = escapeHtml(rule.title || 'قاعدة');
          const content = escapeHtml(rule.content || '');
          const subjectName = subjectNames.get(rule.subject_id);
          return `<article class="card mb-2">
            <h3 class="card-title">${title}</h3>
            ${rule.is_general ? '<span class="badge badge-primary">قواعد عامة</span>' : ''}
            ${subjectName ? `<span class="badge badge-info">${escapeHtml(subjectName)}</span>` : ''}
            <p class="text-sm mt-2" style="white-space:pre-wrap">${content}</p>
          </article>`;
        }).join('');
        initIcons();
      } catch (error) {
        console.error('Quiz rules loading error:', error);
        showError(el, friendlyError(error));
      }
    }

    init();
  </script>
</body>
</html>
