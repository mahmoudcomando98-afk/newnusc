<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>استعادة كلمة المرور | NUSC Student Hub</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">NS</div>
        <h1>استعادة كلمة المرور</h1>
        <p>أدخل بريدك الإلكتروني وسنرسل لك رابط الاستعادة</p>
      </div>
      <form method="post" id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="example@email.com" required autocomplete="email" dir="ltr" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">إرسال رابط الاستعادة</button>
      </form>
      <div class="auth-footer">
        <a href="/login.html">العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { initForgotPasswordPage } from './assets/js/auth.js';
    initForgotPasswordPage();
  </script>
</body>
</html>
