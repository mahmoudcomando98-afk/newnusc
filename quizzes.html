<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="description" content="الكويزات والمواعيد على منصة COMANDO التعليمية" />
  <title>الكويزات | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-2" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=comando-2" />
  <link rel="stylesheet" href="/assets/css/quizzes.css?v=1" />
</head>
<body class="quizzes-page">
  <header class="app-header">
    <div class="container">
      <a href="/home.html" class="logo"><span class="logo-icon">C</span><span>COMANDO</span></a>
      <nav class="desktop-nav">
        <a href="/home.html" data-nav="home">الرئيسية</a>
        <a href="/subjects.html" data-nav="subjects">المواد</a>
        <a href="/quizzes.html" data-nav="quizzes" class="active">الكويزات</a>
        <a href="/schedule.html" data-nav="schedule">الجدول</a>
        <a href="/updates.html" data-nav="updates">آخر التحديثات</a>
      </nav>
      <div class="header-actions">
        <a href="/notifications.html" class="header-btn" title="الإشعارات"><span data-icon="bell"></span></a>
        <a href="/profile.html" class="header-btn" title="حسابي"><span data-icon="user"></span></a>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="container page-content">
      <section class="quizzes-hero" aria-label="الكويزات">
        <div>
          <h1>الكويزات</h1>
          <p>كويزات موادك ومواعيدها وتعليماتها ودرجاتك — كله في مكان واحد.</p>
        </div>
        <div class="qh-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
      </section>
      <div class="quiz-filters" id="tabs" role="tablist" aria-label="تصفية الكويزات">
        <button type="button" class="quiz-chip is-active" data-status="all" role="tab">الكل <span class="qc-count" data-count-for="all">0</span></button>
        <button type="button" class="quiz-chip" data-status="open" role="tab">مفتوحة <span class="qc-count" data-count-for="open">0</span></button>
        <button type="button" class="quiz-chip" data-status="upcoming" role="tab">قادمة <span class="qc-count" data-count-for="upcoming">0</span></button>
        <button type="button" class="quiz-chip" data-status="closed" role="tab">منتهية <span class="qc-count" data-count-for="closed">0</span></button>
      </div>
      <div id="quizzes-list" aria-live="polite">
        <div class="quiz-skeleton" aria-hidden="true">
          <div class="quiz-skel-card"></div>
          <div class="quiz-skel-card"></div>
          <div class="quiz-skel-card"></div>
        </div>
      </div>
    </div>
  </main>
      <footer class="site-footer" role="contentinfo">
      <strong class="footer-brand">COMANDO</strong>
      <div class="footer-credit">
        <span class="footer-credit-label">تم التطوير بواسطة</span>
        <strong class="footer-credit-name">Mahmoud Oshiba</strong>
      </div>
    </footer>
  
  <nav class="bottom-nav">
    <a href="/home.html" data-nav="home"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html" data-nav="subjects"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html" data-nav="quizzes" class="active"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html" data-nav="schedule"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" data-nav="profile"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module" src="/assets/js/quizzes.js?v=quiz-v2"></script>
</body>
</html>
