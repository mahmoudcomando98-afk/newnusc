  <title>الرئيسية | COMANDO</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=comando-cairo-1" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=comando-cairo-1" />
  <link rel="stylesheet" href="/assets/css/install-prompt.css?v=3" />
</head>
<body>
  <div class="install-sheet" id="install-sheet" hidden aria-hidden="true" role="dialog" aria-labelledby="install-title" style="display:none">
    <div class="install-sheet-inner">
      <div class="install-sheet-top">
        <div class="install-sheet-icon"></div>
        <div class="install-sheet-copy">
          <strong id="install-title">حمّل التطبيق الآن</strong>
          <p>ثبّت المنصة على هاتفك عشان توصل أسرع وتشوف التحديثات بسهولة.</p>
        </div>
        <button type="button" class="install-sheet-close" id="install-close" aria-label="إغلاق">×</button>
      </div>
      <div class="install-howto" id="install-howto"></div>
      <div class="install-sheet-actions">
        <button type="button" class="btn-install" id="install-btn">تثبيت التطبيق</button>
        <button type="button" class="btn-later" id="install-later">لاحقاً</button>
      </div>
    </div>
  </div>
  <div id="app-root">
    <p class="text-center text-muted" style="padding:40px">جاري تحميل الرئيسية…</p>
  </div>
  <script type="module">
    import { setupInstallPrompt } from '/assets/js/install-prompt.js?v=5';
    // bootstrap full home if present
    try {
      setupInstallPrompt();
    } catch (e) {
      console.warn(e);
    }
    try {
      await import('/assets/js/home.js');
    } catch (e) {
      console.warn('home.js', e);
      // fallback: soft redirect to subjects if home module missing pieces
    }
  </script>
</body>
</html>
