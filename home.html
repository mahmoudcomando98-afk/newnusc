<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <title>الرئيسية | NUSC</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=compact-v4" />
  <link rel="stylesheet" href="/assets/css/neutral-theme.css?v=compact-v4" />
</head>
<body class="home-page">
  <div class="offline-banner" id="offline-banner">لا يوجد اتصال بالإنترنت</div>
  <header class="app-header">
    <div class="container">
      <a href="/home.html" class="logo"><span class="logo-icon">N</span><span class="logo-word">NUSC</span></a>
      <nav class="desktop-nav">
        <a href="/home.html" data-nav="home" class="active">الرئيسية</a>
        <a href="/subjects.html" data-nav="subjects">المواد</a>
        <a href="/quizzes.html" data-nav="quizzes">الكويزات</a>
        <a href="/schedule.html" data-nav="schedule">الجدول</a>
        <a href="/announcements.html" data-nav="announcements">الإعلانات</a>
      </nav>
      <div class="header-actions">
        <a href="/notifications.html" class="header-btn" title="الإشعارات"><span data-icon="bell"></span><span class="badge" id="notif-badge" style="display:none">0</span></a>
        <a href="/profile.html" class="user-chip" id="user-chip"><span class="user-avatar" id="header-avatar">ط</span><span id="header-name">طالب</span></a>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="container page-content home-content">
      <section class="home-hero" id="home-hero">
        <div class="hero-copy">
          <div class="hero-eyebrow"><span class="hero-dot"></span><span>منصة طلابية</span></div>
          <h1 id="welcome-text">أهلاً بك في NUSC</h1>
          <p id="hero-sub">ملخص سريع للمواد والكويزات والإعلانات.</p>
          <div class="hero-actions">
            <a href="/subjects.html" class="btn btn-primary">المواد</a>
            <a href="/quizzes.html" class="hero-secondary-link">الكويزات</a>
          </div>
        </div>
      </section>
      <div id="important-notice-slot"></div>
      <section class="dashboard-shortcuts" id="shortcuts"></section>
      <section class="home-section">
        <div class="section-header">
          <div>
            <span class="section-kicker">المواد</span>
            <h2>موادك</h2>
          </div>
          <a href="/subjects.html" class="section-more">الكل</a>
        </div>
        <div class="card-grid home-subject-grid" id="subjects-preview">
          <div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div></div>
        </div>
      </section>
      <section class="home-lower-grid">
        <div>
          <div class="section-header">
            <div><span class="section-kicker">كويزات</span><h2>قادمة</h2></div>
            <a href="/quizzes.html" class="section-more">المزيد</a>
          </div>
          <div class="feed-panel" id="quizzes-preview"></div>
        </div>
        <div>
          <div class="section-header">
            <div><span class="section-kicker">إعلانات</span><h2>أحدث</h2></div>
            <a href="/announcements.html" class="section-more">المزيد</a>
          </div>
          <div class="feed-panel" id="announcements-preview"></div>
        </div>
      </section>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="/home.html" data-nav="home" class="active"><span data-icon="home"></span>الرئيسية</a>
    <a href="/subjects.html" data-nav="subjects"><span data-icon="book"></span>المواد</a>
    <a href="/quizzes.html" data-nav="quizzes"><span data-icon="clipboard"></span>الكويزات</a>
    <a href="/schedule.html" data-nav="schedule"><span data-icon="calendar"></span>الجدول</a>
    <a href="/profile.html" data-nav="profile"><span data-icon="user"></span>حسابي</a>
  </nav>
  <script type="module" src="/assets/js/home.js?v=compact-v4"></script>
</body>
</html>
